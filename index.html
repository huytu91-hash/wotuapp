<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="light only"/>
<title>WOTU — Bao gia thiet ke va noi that</title>
<style>
body{margin:0;background:#f3efe8;color:#161616;font-family:Arial,Helvetica,sans-serif}
.w{max-width:840px;margin:0 auto;padding:20px 16px 96px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{display:flex;gap:10px;align-items:center}
.m{width:46px;height:46px;border-radius:14px;background:#111;color:#fff;text-align:center;line-height:46px;font-weight:800}
h1{font-size:26px;margin:12px 0 8px}
.muted{color:#6b645c;font-size:14px;line-height:1.5}
.card{background:#fff;border:1px solid #e7e0d6;border-radius:18px;padding:16px;margin:12px 0}
input,textarea,select{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #e0d8ce;border-radius:12px;font-size:16px}
.btn{display:block;width:100%;box-sizing:border-box;padding:14px;margin-top:10px;border:0;border-radius:30px;background:#111;color:#fff;font-weight:700;font-size:16px}
.btn2{background:#fff;color:#111;border:1px solid #ddd}
a{color:#8f1d1d}
.err{color:#8f1d1d}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #eee;display:flex}
.nav button{flex:1;border:0;background:0;padding:14px 0 16px;font-size:12px}
.line{overflow:hidden;padding:10px 0;border-bottom:1px solid #eee}
.tot{background:#111;color:#fff;border-radius:16px;padding:16px;margin-top:12px}
@media print{.nav,.noprint{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<div class="w" id="app">
  <h1>WOTU</h1>
  <p>Dang tai... Neu khong doi, hay mo bang Chrome.</p>
</div>
<div class="nav noprint">
  <button type="button" onclick="goHome()">Trang chu</button>
  <button type="button" onclick="go('design')">Thiet ke</button>
  <button type="button" onclick="go('interior')">Noi that</button>
</div>
<script>
var MAIL="Huytu91@gmail.com";
var PHONE="0944437238";
var WEB="https://wotu.vn";
var FB="https://www.facebook.com/wotuani";
var ZALO="https://zalo.me/0944437238";
var S={page:"welcome",c:null,dText:"Can ho 65m2 goi co ban",iText:"Lam bep 3m, tu do 1m9",dRes:null,iRes:null,last:null};

function vnd(n){return Math.round(n).toLocaleString("vi-VN")+"d"}
function money(s){s=Math.max(0,Math.round(s));var v=Math.round(s*0.08);return {sub:s,vat:v,total:s+v}}
function loadC(){
  try{var x=localStorage.getItem("wotu_c");S.c=x?JSON.parse(x):null;}catch(e){S.c=null;}
  if(S.c&&S.c.fullName)S.page="home";
}
function saveC(){try{localStorage.setItem("wotu_c",JSON.stringify(S.c));}catch(e){}}
function go(p){S.page=p;draw()}
function goHome(){S.page=S.c?"home":"welcome";draw()}
function links(){
  return '<p class="muted noprint"><a href="'+WEB+'">wotu.vn</a> · <a href="'+FB+'">Facebook</a> · <a href="'+ZALO+'">Zalo</a> · <a href="tel:'+PHONE+'">'+PHONE+' Tu</a></p>';
}
function sendMail(code,type,total){
  try{
    fetch("https://formsubmit.co/ajax/"+MAIL,{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({_subject:"Lead WOTU "+code,ten:S.c.fullName,sdt:S.c.phone,diachi:S.c.address,loai:type,tong:vnd(total)})
    });
  }catch(e){}
}
function saveQuote(type,total){
  if(!S.c){go("welcome");return;}
  var n=1;
  try{n=Number(localStorage.getItem("wotu_n")||0)+1;localStorage.setItem("wotu_n",String(n));}catch(e){}
  var code="WOTU-Q-"+( "000000"+n).slice(-6);
  S.last={code:code,type:type,total:total};
  sendMail(code,type,total);
  S.page="done";
  draw();
  setTimeout(function(){window.print();},400);
}

function submitC(){
  var name=document.getElementById("fn").value.replace(/^\s+|\s+$/g,"");
  var phone=document.getElementById("ph").value.replace(/[\s.\-]/g,"");
  var address=document.getElementById("ad").value.replace(/^\s+|\s+$/g,"");
  var ok=document.getElementById("ok").checked;
  var e="";
  if(!name)e+="Nhap ho ten. ";
  if(!/^(0|\+84)(3|5|7|8|9)\d{8}$/.test(phone))e+="SDT khong hop le. ";
  if(!address)e+="Nhap dia chi. ";
  if(!ok)e+="Can dong y du lieu. ";
  document.getElementById("er").innerHTML=e;
  if(e)return;
  S.c={fullName:name,phone:phone,address:address};
  saveC();
  go("home");
}

function doDesign(){
  S.dText=document.getElementById("dt").value;
  var t=S.dText.toLowerCase().replace(",", ".");
  var m=t.match(/(\d+(?:\.\d+)?)\s*m\s*2/);
  if(!m)m=t.match(/(\d+(?:\.\d+)?)\s*m²/);
  var area=m?Number(m[1]):0;
  var p=119000, name="Co ban";
  if(t.indexOf("tiet kiem")>=0||t.indexOf("tiết kiệm")>=0){p=79000;name="Tiet kiem";}
  if(t.indexOf("hoan thien")>=0||t.indexOf("hoàn thiện")>=0){p=179000;name="Hoan thien";}
  if(!area){S.dRes={err:"Nhap dien tich, vi du 65m2"};draw();return;}
  if(area<30){S.dRes={err:"Duoi 30m2 vui long goi "+PHONE};draw();return;}
  S.dRes={ok:1,name:name,area:area,mon:money(area*p)};
  draw();
}

function doInterior(){
  S.iText=document.getElementById("it").value;
  var t=S.iText.toLowerCase();
  var lines=[], sub=0;
  var bw=t.match(/b[eế]p[^0-9]{0,12}(\d+[.,]?\d*)\s*m/);
  if(bw){
    var w=Number(String(bw[1]).replace(",", "."));
    lines.push(["Tu bep duoi — MDF Melamine ACCPANEL/KES/S6/Moc Phat/BMH, ngang "+w+"m, cao 850mm", w*2100000]);
    lines.push(["Tu bep tren — cung vat lieu, ngang "+w+"m, cao 700mm", w*2000000]);
    lines.push(["Mat da kim sa, dai "+w+"m", w*1350000]);
    lines.push(["Op kinh son 8li, dai "+w+"m", w*850000]);
    lines.push(["LED + cam bien", w*250000+200000]);
  }
  var tu=t.match(/t[uủ][^0-9]{0,14}(\d+[.,]?\d*)\s*m/);
  if(tu){
    var tv=Number(String(tu[1]).replace(",", "."));
    lines.push(["Tu ao ngu master — MDF Melamine, kich thuoc yeu cau "+tv+"m", tv*1950000]);
  }
  if(!lines.length){S.iRes={err:"Thu: lam bep 3m, tu do 1m9"};draw();return;}
  for(var i=0;i<lines.length;i++)sub+=lines[i][1];
  S.iRes={ok:1,lines:lines,mon:money(sub)};
  draw();
}

function quoteBox(mon){
  return '<div class="tot">Chua VAT '+vnd(mon.sub)+'<br>VAT 8% '+vnd(mon.vat)+'<br><b>Tong '+vnd(mon.total)+'</b></div><p class="muted">VAT 8% theo NQ 204/2025 den 31/12/2026. Bao gia so bo. Vat lieu An Cuong / Minh Long: lien he WOTU.</p>';
}

function draw(){
  var h= '<div class="row"><div class="logo"><div class="m">W</div><div><b>WOTU</b><div class="muted">Noi that cho to am Viet</div></div></div></div>'+links();
  if(S.page==="welcome"){
    h+="<h1>Bao gia thiet ke va noi that</h1>";
    h+="<div class='card'>";
    h+="<div>Ho va ten *</div><input id='fn'/>";
    h+="<div>So dien thoai *</div><input id='ph'/>";
    h+="<div>Dia chi *</div><input id='ad'/>";
    h+="<p><label><input type='checkbox' id='ok'/> Dong y luu thong tin tu van</label></p>";
    h+="<div class='err' id='er'></div>";
    h+="<button class='btn' onclick='submitC()'>Tiep tuc</button></div>";
  }else if(S.page==="home"){
    h+="<p class='muted'>Xin chao <b>"+S.c.fullName+"</b></p>";
    h+="<div class='card'><b>Thiet ke</b><p class='muted'>Nhap dien tich, chon goi.</p><button class='btn' onclick='go(\"design\")'>Mo thiet ke</button></div>";
    h+="<div class='card'><b>Noi that</b><p class='muted'>Nhap bep, tu ao.</p><button class='btn' onclick='go(\"interior\")'>Mo noi that</button></div>";
  }else if(S.page==="design"){
    h+="<h1>Thiet ke</h1><p class='muted'>Vi du: can ho 65m2 goi co ban</p>";
    h+="<textarea id='dt' rows='4'>"+S.dText+"</textarea>";
    h+="<button class='btn noprint' onclick='doDesign()'>Phan tich</button>";
    if(S.dRes&&S.dRes.err)h+="<div class='card err'>"+S.dRes.err+"</div>";
    if(S.dRes&&S.dRes.ok){
      h+="<div class='card'><b>Goi "+S.dRes.name+" — "+S.dRes.area+" m2</b>";
      h+="<p class='muted'>Ho so theo goi. Khong hien don gia /m2.</p>"+quoteBox(S.dRes.mon);
      h+="<button class='btn noprint' onclick='saveQuote(\"Thiet ke\","+S.dRes.mon.total+")'>Tai PDF</button></div>";
    }
    h+="<button class='btn btn2 noprint' onclick='goHome()'>Quay lai</button>";
  }else if(S.page==="interior"){
    h+="<h1>Noi that</h1><p class='muted'>Vi du: lam bep 3m, tu do 1m9</p>";
    h+="<textarea id='it' rows='4'>"+S.iText+"</textarea>";
    h+="<button class='btn noprint' onclick='doInterior()'>Phan tich</button>";
    if(S.iRes&&S.iRes.err)h+="<div class='card err'>"+S.iRes.err+"</div>";
    if(S.iRes&&S.iRes.ok){
      h+="<div class='card'>";
      for(var i=0;i<S.iRes.lines.length;i++){
        h+="<div class='line'>"+S.iRes.lines[i][0]+"<br><b>"+vnd(S.iRes.lines[i][1])+"</b></div>";
      }
      h+=quoteBox(S.iRes.mon);
      h+="<button class='btn noprint' onclick='saveQuote(\"Noi that\","+S.iRes.mon.total+")'>Tai PDF</button></div>";
    }
    h+="<button class='btn btn2 noprint' onclick='goHome()'>Quay lai</button>";
  }else if(S.page==="done"){
    h+="<h1>"+S.last.code+"</h1><p class='muted'>Da gui lead ve mail. Trong hop thoai in chon Save as PDF.</p>";
    h+="<button class='btn btn2' onclick='goHome()'>Ve trang chu</button>";
  }
  document.getElementById("app").innerHTML=h;
}

try{loadC();draw();}
catch(e){document.getElementById("app").innerHTML="<h1>WOTU</h1><p class='err'>"+e.message+"</p>";}
</script>
</body>
</html>
