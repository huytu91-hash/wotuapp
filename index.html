<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>WOTU — Báo giá thiết kế & nội thất</title>
<meta name="theme-color" content="#111111"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
 --ink:#121212; --red:#8f1d1d; --muted:#6f675f; --line:#e6dfd6;
 --paper:#f3efe8; --card:#fffcf8;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;color:var(--ink);
 font-family:"Be Vietnam Pro",system-ui,sans-serif;
 background:
 radial-gradient(920px 480px at 0% -8%, rgba(143,29,29,.10), transparent 50%),
 radial-gradient(700px 400px at 100% 0%, rgba(20,20,20,.05), transparent 46%),
 var(--paper);
 min-height:100vh;
}
a{color:var(--red);text-decoration:none}
.shell{max-width:880px;margin:0 auto;padding:22px 18px 112px;animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}
.brand{display:flex;gap:12px;align-items:center}
.mark{
 width:50px;height:50px;border-radius:16px;background:linear-gradient(160deg,#1a1a1a,#8f1d1d 78%);
 color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:.06em;
 box-shadow:0 14px 28px rgba(143,29,29,.28);
}
.brand b{letter-spacing:.28em;font-size:21px}
.brand b i{color:var(--red);font-style:normal}
.brand small{display:block;margin-top:3px;color:var(--muted);font-size:11px;letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:12px;color:#111;margin-left:6px}
h1{font-size:clamp(1.55rem,4.2vw,2.15rem);letter-spacing:-.04em;line-height:1.15;margin:6px 0 10px}
.lead,.note{color:var(--muted);line-height:1.65}
.note{font-size:12.5px}
.card{
 background:var(--card);border:1px solid rgba(0,0,0,.06);border-radius:22px;
 padding:18px;margin:14px 0;box-shadow:0 18px 50px rgba(28,16,8,.06);
 animation:rise .45s ease both;
}
.hero{display:grid;gap:12px}
@media(min-width:720px){.hero{grid-template-columns:1fr 1fr}}
.hero .card{min-height:168px;display:flex;flex-direction:column}
.hero .card b{font-size:1.15rem}
.kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--red);font-weight:700}
label{display:block;font-size:13px;font-weight:500;margin:12px 0 0}
input,select,textarea{
 width:100%;margin-top:7px;padding:13px 14px;border:1px solid var(--line);
 border-radius:14px;font:inherit;background:#fff;
}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #171717;outline-offset:1px}
.btn{
 width:100%;border:0;border-radius:999px;padding:14px 16px;font:inherit;font-weight:700;
 cursor:pointer;margin-top:11px;transition:transform .15s,box-shadow .2s;
}
.btn-p{background:#141414;color:#fff;box-shadow:0 10px 22px rgba(0,0,0,.18)}
.btn-g{background:#fff;border:1px solid var(--line)}
.btn:active{transform:scale(.985)}
.err{color:var(--red);font-size:12px;margin-top:8px}
.ok{color:#1c7a40;font-size:13px}
.sheet{padding:22px}
.line{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.price{background:#111;color:#fff;border-radius:20px;padding:20px;margin-top:14px}
.price .r{display:flex;justify-content:space-between;color:#c8c0b6;margin:7px 0;font-size:14px}
.price .t{display:flex;justify-content:space-between;align-items:end;border-top:1px solid #2b2b2b;padding-top:12px;margin-top:8px}
.price .t b{font-size:1.5rem;letter-spacing:-.03em}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(255,252,248,.9);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav button{flex:1;border:0;background:0;padding:13px 0 18px;font-size:11px;color:#8a837a}
.nav button.on{color:var(--red);font-weight:700}
.hidden{display:none}
@media print{
 body{background:#fff}
 .nav,.no-print,.links{display:none!important}
 .shell{padding:0;animation:none}
 .card{box-shadow:none;border-color:#ddd}
}
</style>
</head>
<body>
<div class="shell" id="app"></div>
<nav class="nav hidden" id="nav">
 <button data-go="home">Trang chủ</button>
 <button data-go="design">Thiết kế</button>
 <button data-go="interior">Nội thất</button>
 <button data-go="history">Hồ sơ</button>
</nav>
<script>
const VAT=.08, MAIL="Huytu91@gmail.com", PHONE="0944437238";
const WEB="https://wotu.vn", FB="https://www.facebook.com/wotuani", ZALO="https://zalo.me/0944437238";
const VND=n=>Math.round(n).toLocaleString("vi-VN")+"đ";
const money=s=>{s=Math.max(0,Math.round(s));const v=Math.round(s*VAT);return{sub:s,vat:v,total:s+v}};
const S={
 page:localStorage.wotu_c?"home":"welcome",
 c:JSON.parse(localStorage.wotu_c||"null"),
 quotes:JSON.parse(localStorage.wotu_q||"[]"),
 extra:null,msg:"",busy:false,
 dText:"Căn hộ 65m2 gói cơ bản", dAsk:null, dQuote:null,
 iText:"Làm bếp 3m, tủ đồ 1m9", iAsk:null, iDraft:null, iQuote:null
};
const PKG={
 "tiet-kiem":{name:"Tiết kiệm",p:79000,inc:["Mặt bằng công năng 2D","Phối cảnh 3D nội thất các không gian chính"]},
 "co-ban":{name:"Cơ bản",p:119000,inc:["Toàn bộ gói Tiết kiệm","2D chi tiết kích thước","Chỉ định vật liệu nội thất","2D ổ cắm điện nước"]},
 "hoan-thien":{name:"Hoàn thiện",p:179000,inc:["Toàn bộ gói Cơ bản","Hồ sơ kết cấu","3D mặt đứng / mặt tiền","Hồ sơ bàn giao hoàn chỉnh"]}
};
function seq(){const n=+(localStorage.wotu_n||0)+1;localStorage.wotu_n=n;return"WOTU-Q-"+String(n).padStart(6,"0")}
function go(p,ex){S.page=p;S.extra=ex||null;S.busy=false;render()}
function head(back){
 return `<div class="top">
 <div class="brand"><div class="mark">W</div><div><b>WO<i>TU</i></b><small>Nội thất cho tổ ấm Việt</small></div></div>
 <div class="links no-print">
 <a class="pill" href="${WEB}" target="_blank">wotu.vn</a>
 <a class="pill" href="${FB}" target="_blank">Facebook</a>
 <a class="pill" href="tel:${PHONE}">Gọi Tú</a>
 <a class="pill" href="${ZALO}" target="_blank">Zalo</a>
 </div>
 </div>${back?`<button class="btn btn-g no-print" style="width:auto;padding:8px 14px" onclick="go('${back}')">← Quay lại</button>`:""}`;
}
function vatBlock(m){
 return `<div class="price">
 <div class="r"><span>Thành tiền chưa VAT</span><span>${VND(m.sub)}</span></div>
 <div class="r"><span>VAT 8%</span><span>${VND(m.vat)}</span></div>
 <div class="t"><span>Tổng cộng</span><b>${VND(m.total)}</b></div>
 </div>
 <p class="note">VAT 8% theo Nghị quyết 204/2025/QH15, áp đến 31/12/2026. Báo giá sơ bộ — không phải hợp đồng.</p>`;
}
function matNote(){
 return `<p class="note">Vật liệu MDF chống ẩm phủ Melamine: ACCPANEL, KES, S6, Mộc Phát, BMH. Cánh Acrylic: LIVAS, ALD. Quý khách dùng An Cường, Minh Long hoặc thương hiệu khác vui lòng liên hệ WOTU để được báo giá lại. Hotline ${PHONE} — Tú.</p>`;
}
async function sendMail(row){
 const body={_subject:"Lead WOTU "+row.code,ten:row.c.fullName,sdt:row.c.phone,diachi:row.c.address,ma:row.code,loai:row.quote.type,chitiet:row.quote.detail||"",tong:VND(row.quote.money.total)};
 try{
 await fetch("https://formsubmit.co/ajax/"+MAIL,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(body)});
 S.msg="Đã gửi thông tin về email WOTU.";
 }catch(e){S.msg="Không gửi được mail tự động. Dùng Zalo hoặc gọi Tú."}
}
function savePdf(quote){
 if(!S.c)return go("welcome");
 const row={code:seq(),c:S.c,quote,at:new Date().toISOString()};
 S.quotes.unshift(row);localStorage.wotu_q=JSON.stringify(S.quotes.slice(0,80));
 sendMail(row);S.extra=row;S.page="done";render();setTimeout(()=>window.print(),500);
}
function welcome(){
 return `${head()}
 <p class="kicker">WOTU Studio</p>
 <h1>Báo giá thiết kế<br>và nội thất.</h1>
 <p class="lead">Một lần nhập thông tin — nhận báo giá sơ bộ, tải PDF và được chăm sóc qua Zalo.</p>
 <div class="card">
 <label>Họ và tên *<input id="fn" value="${S.c?.fullName||""}" autocomplete="name"></label>
 <label>Số điện thoại *<input id="ph" inputmode="tel" value="${S.c?.phone||""}"></label>
 <label>Địa chỉ *<input id="ad" value="${S.c?.address||""}"></label>
 <label style="display:flex;gap:8px;font-weight:400"><input type="checkbox" id="ok" ${S.c?.consent?"checked":""} style="width:auto"> Đồng ý để WOTU lưu thông tin nhằm lập báo giá và tư vấn.</label>
 <div class="err" id="er"></div>
 <button class="btn btn-p" onclick="submitC()">Bắt đầu</button>
 </div>`;
}
function submitC(){
 const fullName=fn.value.trim(),phone=ph.value.replace(/[\s.\-]/g,""),address=ad.value.trim(),consent=ok.checked,e=[];
 if(!fullName)e.push("Nhập họ tên.");
 if(!/^(0|\+84)(3|5|7|8|9)\d{8}$/.test(phone))e.push("Số điện thoại Việt Nam không hợp lệ.");
 if(!address)e.push("Nhập địa chỉ.");
 if(!consent)e.push("Cần đồng ý xử lý dữ liệu.");
 if(e.length){er.textContent=e.join(" ");return}
 S.c={fullName,phone,address,consent};localStorage.wotu_c=JSON.stringify(S.c);go("home");
}
function home(){
 return `${head()}
 <p class="lead">Xin chào, <b>${S.c.fullName}</b>. Chọn dịch vụ cần báo giá.</p>
 <div class="hero">
 <div class="card"><span class="kicker">01</span><b>Thiết kế</b><p class="note">Mô tả căn hộ hoặc nhà — hệ thống đọc diện tích và gói.</p><button class="btn btn-p" onclick="go('design')">Mở thiết kế</button></div>
 <div class="card"><span class="kicker">02</span><b>Nội thất</b><p class="note">Mô tả bếp, tủ áo — hệ thống điền hạng mục để bạn duyệt.</p><button class="btn btn-p" onclick="go('interior')">Mở nội thất</button></div>
 </div>`;
}
function parseDesign(t){
 const low=t.toLowerCase().replace(",",".");
 const m=low.match(/(\d+(?:\.\d+)?)\s*m\s*2|(\d+(?:\.\d+)?)\s*m²/);
 const area=m?+(m[1]||m[2]):null;
 let pkg="co-ban";
 if(/tiết kiệm|tiet kiem/.test(low))pkg="tiet-kiem";
 if(/hoàn thiện|hoan thien/.test(low))pkg="hoan-thien";
 if(/cơ bản|co ban/.test(low))pkg="co-ban";
 return{area,pkg};
}
function analyzeD(){
 S.dText=document.getElementById("dt").value;S.busy=true;S.dQuote=null;render();
 setTimeout(()=>{
 const r=parseDesign(S.dText);S.busy=false;
 if(!r.area){S.dAsk={need:"area"};render();return}
 if(r.area<30){S.dAsk={need:"small",area:r.area};render();return}
 S.dAsk={need:"ok",area:r.area,pkg:r.pkg};render();
 },550);
}
function confirmD(){
 const a=S.dAsk,g=PKG[a.pkg],m=money(a.area*g.p);
 S.dQuote={type:"Thiết kế",detail:`${g.name} · ${a.area} m²`,lines:[{name:"Thiết kế — gói "+g.name,spec:`Diện tích ${a.area} m². ${g.inc.join("; ")}. Sửa tối đa 3 lần.`,amt:a.area*g.p}],money:m};
 render();
}
function design(){
 const a=S.dAsk,q=S.dQuote;
 return `${head("home")}<p class="kicker">Thiết kế</p><h1>Mô tả nhu cầu.</h1>
 <p class="lead">Ví dụ: căn hộ 65m2 gói cơ bản.</p>
 <textarea id="dt">${S.dText}</textarea>
 <button class="btn btn-p no-print" onclick="analyzeD()">Phân tích nhu cầu</button>
 ${S.busy?`<div class="card wait"><span class="dot"></span> Đang đọc diện tích và gói…</div>`:""}
 ${a?.need==="area"?`<div class="card"><b>Chưa thấy diện tích</b><p class="note">Nhập thêm số m², ví dụ 65m2.</p></div>`:""}
 ${a?.need==="small"?`<div class="card"><b>${a.area} m²</b><p class="note">Dưới 30 m² vui lòng liên hệ trực tiếp.</p><a class="btn btn-p" href="${ZALO}" target="_blank" style="display:block;text-align:center">Zalo Tú</a></div>`:""}
 ${a?.need==="ok"&&!q?`<div class="card"><b>Đã nhận ${a.area} m² · gói ${PKG[a.pkg].name}</b>
 <p class="note">Bạn muốn xem báo giá sơ bộ? Có thể đổi gói trước khi chốt.</p>
 <label>Gói<select onchange="S.dAsk.pkg=this.value">${Object.entries(PKG).map(([k,v])=>`<option value="${k}" ${a.pkg===k?"selected":""}>${v.name}</option>`).join("")}</select></label>
 <label>Diện tích (m²)<input type="number" value="${a.area}" oninput="S.dAsk.area=+this.value"></label>
 <button class="btn btn-p" onclick="confirmD()">Đồng ý, xem báo giá</button></div>`:""}
 ${q?quoteView(q):""}`;
}
function num(s){return s?+String(s).replace(",","."):0}
function parseInterior(t){
 const low=t.toLowerCase();
 const out={bep:null,tu:null};
 const bm=low.match(/bếp[^0-9]{0,10}(\d+[.,]?\d*)\s*m(?!\s*2)/);
 if(bm) out.bep={w:num(bm[1])};
 const tm=low.match(/tủ\s*(đồ|áo|quần áo)?[^0-9]{0,10}(\d+[.,]?\d*)\s*(m2|m²|m)/);
 if(tm) out.tu={v:num(tm[2]),unit:/m2|m²/.test(tm[3]||"")?"m2":"ngang"};
 else if(/tủ|1m9|1m8/.test(low)){
 const n=low.match(/(\d+[.,]?\d*)\s*m/);
 if(n&&!bm) out.tu={v:num(n[1]),unit:"?"};
 }
 return out;
}
function analyzeI(){
 S.iText=document.getElementById("it").value;S.busy=true;S.iQuote=null;render();
 setTimeout(()=>{
 const p=parseInterior(S.iText);S.busy=false;
 if(p.tu&&p.tu.unit==="?"){S.iAsk={type:"unit",v:p.tu.v,p};render();return}
 if(p.tu&&p.tu.unit==="ngang"&&!p.tu.h){S.iAsk={type:"height",v:p.tu.v,p};render();return}
 S.iAsk={type:"ok"};S.iDraft=buildDraft(p);render();
 },550);
}
function setUnit(u){const p=S.iAsk.p;p.tu.unit=u;if(u==="ngang"){S.iAsk={type:"height",v:p.tu.v,p};render();return}S.iAsk={type:"ok"};S.iDraft=buildDraft(p);render()}
function setHeight(){const h=+document.getElementById("ih").value||2.4;const p=S.iAsk.p;p.tu.h=h;p.tu.m2=+(p.tu.v*h).toFixed(2);S.iAsk={type:"ok"};S.iDraft=buildDraft(p);render()}
function buildDraft(p){return{bepOn:!!p.bep,tuOn:!!p.tu,bepW:p.bep?p.bep.w:3,tuM2:p.tu?(p.tu.m2||p.tu.v):1.9,da:true,kinh:true,led:true}}
function linesFromDraft(d){
 const L=[];
 if(d.bepOn){
 const w=d.bepW||0;
 L.push({name:"Tủ bếp dưới",spec:`Thùng MDF chống ẩm phủ Melamine (ACCPANEL / KES / S6 / Mộc Phát / BMH), cánh Melamine. Ngang ${w} m · cao 850 mm.`,amt:w*2100000});
 L.push({name:"Tủ bếp trên",spec:`Cùng vật liệu. Ngang ${w} m · cao 700 mm.`,amt:w*2000000});
 if(d.da) L.push({name:"Mặt đá bếp",spec:`Đá kim sa. Dài ${w} m.`,amt:w*1350000});
 if(d.kinh) L.push({name:"Ốp đứng bếp",spec:`Kính sơn màu 8li. Dài ${w} m.`,amt:w*850000});
 if(d.led) L.push({name:"Đèn LED bếp",spec:`LED theo chiều dài bếp + cảm biến nhấn mở.`,amt:w*250000+200000});
 }
 if(d.tuOn) L.push({name:"Tủ quần áo — ngủ master",spec:`Thùng MDF chống ẩm phủ Melamine. Quy đổi ${d.tuM2} m² theo kích thước yêu cầu.`,amt:d.tuM2*1950000});
 return L;
}
function confirmI(){const L=lines FromDraft(S.iDraft);S.iQuote={type:"Nội thất",detail:S.iText,lines:L,money:money(L.reduce((s,x)=>s+x.amt,0))};render()}
function interior(){
 const a=S.iAsk,d=S.iDraft,q=S.iQuote;
 return `${head("home")}<p class="kicker">Nội thất</p><h1>Mô tả không gian.</h1>
 <p class="lead">Ví dụ: làm bếp 3m, tủ đồ 1m9.</p>
 <textarea id="it">${S.iText}</textarea>
 <button class="btn btn-p no-print" onclick="analyzeI()">Phân tích nhu cầu</button>
 ${S.busy?`<div class="card wait"><span class="dot"></span> Đang tách hạng mục và kích thước…</div>`:""}
 ${a?.type==="unit"?`<div class="card"><b>${a.v} m là m² hay chiều ngang tủ?</b>
 <button class="btn btn-p" onclick="setUnit('m2')">Là m²</button>
 <button class="btn btn-g" onclick="setUnit('ngang')">Là chiều ngang</button></div>`:""}
 ${a?.type==="height"?`<div class="card"><b>Ngang ${a.v} m. Chiều cao tủ?</b>
 <label>Mét cao<input id="ih" type="number" step="0.1" value="2.4"></label>
 <p class="note">Gợi ý tủ áo 2,4 m.</p>
 <button class="btn btn-p" onclick="setHeight()">Tiếp tục</button></div>`:""}
 ${a?.type==="ok"&&d&&!q?`<div class="card"><b>Nhu cầu đã đúng chưa?</b>
 <p class="note">Bếp được gợi ý thêm đá kim sa, kính 8li và LED. Bỏ tick nếu không cần.</p>
 <label style="display:flex;gap:8px"><input type="checkbox" style="width:auto" ${d.bepOn?"checked":""} onchange="S.iDraft.bepOn=this.checked;render()"> Bếp</label>
 ${d.bepOn?`<label>Ngang bếp (m)<input type="number" step="0.1" value="${d.bepW}" oninput="S.iDraft.bepW=+this.value"></label>
 <label style="display:flex;gap:8px"><input type="checkbox" style="width:auto" ${d.da?"checked":""} onchange="S.iDraft.da=this.checked"> Mặt đá kim sa</label>
 <label style="display:flex;gap:8px"><input type="checkbox" style="width:auto" ${d.kinh?"checked":""} onchange="S.iDraft.kinh=this.checked"> Kính ốp 8li</label>
 <label style="display:flex;gap:8px"><input type="checkbox" style="width:auto" ${d.led?"checked":""} onchange="S.iDraft.led=this.checked"> LED + cảm biến</label>`:""}
 <label style="display:flex;gap:8px"><input type="checkbox" style="width:auto" ${d.tuOn?"checked":""} onchange="S.iDraft.tuOn=this.checked;render()"> Tủ áo ngủ master</label>
 ${d.tuOn?`<label>Quy đổi m²<input type="number" step="0.1" value="${d.tuM2}" oninput="S.iDraft.tuM2=+this.value"></label>`:""}
 <button class="btn btn-p" onclick="confirmI()">Đồng ý, xem báo giá</button></div>`:""}
 ${q?quoteView(q):""}`;
}
function quoteView(q){
 return `<div class="card sheet">
 <span class="kicker">Báo giá sơ bộ</span>
 <h1 style="font-size:1.4rem;margin-top:6px">WOTU</h1>
 <p class="note">${S.c?S.c.fullName+" · "+S.c.phone+"<br>"+S.c.address:""}</p>
 ${q.lines.map(l=>`<div class="line"><div><b>${l.name}</b><div class="note">${l.spec}</div></div><b>${VND(l.amt)}</b></div>`).join("")}
 ${vatBlock(q.money)}${matNote()}
 </div>
 <button class="btn btn-p no-print" onclick='savePdf(${JSON.stringify(q)})'>Tải báo giá PDF</button>
 <a class="btn btn-g no-print" href="${ZALO}" target="_blank" style="display:block;text-align:center">Chat Zalo với Tú</a>`;
}
function history(){
 if(!S.quotes.length) return `${head("home")}<h1>Hồ sơ</h1><p class="lead">Chưa có báo giá.</p>`;
 return `${head("home")}<h1>Hồ sơ</h1>`+S.quotes.map(q=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>${q.code}</b><span>${VND(q.quote.money.total)}</span></div><p class="note">${q.quote.type} · ${new Date(q.at).toLocaleString("vi-VN")}</p></div>`).join("");
}
function done(){
 const q=S.extra;if(!q)return history();
 return `${head("home")}<p class="kicker">${q.code}</p><h1>Đã lập báo giá.</h1>
 ${S.msg?`<p class="ok">${S.msg}</p>`:""}
 ${quoteView(q.quote)}
 <p class="note no-print">Trong hộp thoại in, chọn Save as PDF.</p>`;
}
function render(){
 const map={welcome,home,design,interior,history,done};
 app.innerHTML=(map[S.page]||home)();
 nav.className=S.page==="welcome"?"nav hidden":"nav";
 [...nav.querySelectorAll("button")].forEach(b=>b.className=b.dataset.go===S.page?"on":"");
}
nav.onclick=e=>{if(e.target.dataset.go)go(e.target.dataset.go)};
render();
</script>
</body>
</html>
