<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WOTU</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--paper:#F4F1EA;--ink:#1C1917;--slate:#2C4A5C;--line:#E6DFD4;--muted:#6B645C;--red:#8B1E1E;--card:#FFFcf7}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;background:#F4F1EA;color:#1C1917;font-size:15px;line-height:1.55}
.w{max-width:1120px;margin:0 auto;padding:20px 18px 80px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.brand{display:flex;gap:14px;align-items:center}
.brand img{height:52px;width:auto;display:block}
.links a{margin-left:12px;color:#8B1E1E;text-decoration:none;font-size:13px;font-weight:500}
h1{font-size:28px;letter-spacing:-.02em;margin:14px 0 8px;font-weight:600}
.lead,.muted,.note,.live{color:#6B645C;line-height:1.6}
.lead{max-width:42ch;margin:0 0 18px}
.card{background:#FFFcf7;border-radius:16px;padding:18px;margin:0 0 14px;border:1px solid #E6DFD4}
.card h2{font-size:14px;margin:0 0 10px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pkg{border:1px solid #E6DFD4;border-radius:14px;padding:14px;margin:0 0 10px;cursor:pointer;background:#fff}
.pkg.on{border-color:#1C1917}
.row{display:flex;justify-content:space-between;gap:8px}
label{display:block;margin:10px 0 0;font-size:12px;font-weight:500}
input,select,textarea{width:100%;margin-top:6px;padding:10px 12px;border:1px solid #E6DFD4;border-radius:10px;font:inherit;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid #E6DFD4;background:#fff;border-radius:999px;padding:7px 12px;font-size:13px}
.check{display:flex;gap:10px;margin:12px 0;font-size:13px}
.btn{width:100%;border:0;border-radius:999px;padding:12px 16px;margin-top:12px;background:#1C1917;color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn2{background:#fff;color:#1C1917;border:1px solid #E6DFD4}
.tot{background:#1C1917;color:#fff;border-radius:14px;padding:16px;margin-top:10px}
.line{padding:12px 0;border-bottom:1px solid #efe8de;display:flex;gap:10px}
.err{color:#8B1E1E;font-size:13px}
.lay{display:grid;gap:16px}
.printonly{display:none}
@media(min-width:960px){.lay{grid-template-columns:1.05fr .9fr}.side{position:sticky;top:16px}}
@media print{.noprint{display:none!important}.printonly{display:block!important}.brand img{height:60px}h1{display:none}}
</style>
</head>
