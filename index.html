<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WOTU — Báo giá tự động</title>
<meta name="description" content="Báo giá thiết kế, xây dựng và nội thất WOTU. Nội thất cho tổ ấm Việt."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --red:#9b1c1c; --ink:#141414; --muted:#6b645c; --paper:#f4f0ea; --line:#e7e0d6; --card:#fff;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
a{color:var(--red);text-decoration:none}
.shell{max-width:860px;margin:0 auto;padding:22px 16px 120px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:48px;height:48px;border-radius:14px;background:#111;color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:.06em}
.brand b{letter-spacing:.22em;font-size:20px}
.brand b span{color:var(--red)}
.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.links{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.links a,.chip,.btn{border-radius:999px;font:inherit}
.links a{border:1px solid var(--line);background:#fff;padding:8px 12px;font-size:12px;color:#111}
h1{font-size:clamp(1.45rem,4vw,2rem);letter-spacing:-.03em;line-height:1.2;margin:10px 0 8px}
.lead{color:var(--muted);line-height:1.6;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}
.card.on{border-color:#111}
label{display:block;font-size:13px;font-weight:500;margin:12px 0 0}
input,select,textarea{width:100%;margin-top:6px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#faf8f4}
.btn{width:100%;border:0;padding:14px 16px;font-weight:700;cursor:pointer;margin-top:10px}
.btn-p{background:var(--ink);color:#fff}
.btn-g{background:#fff;border:1px solid var(--line)}
.btn[disabled]{opacity:.4}
.err{color:var(--red);font-size:12px;margin-top:8px}
.note{color:var(--muted);font-size:12px;line-height:1.55;margin:8px 0 0}
.price{background:#111;color:#fff;border-radius:20px;padding:20px;margin-top:14px}
.price .r{display:flex;justify-content:space-between;color:#c9c2b8;font-size:14px;margin:7px 0}
.price .t{display:flex;justify-content:space-between;align-items:end;border-top:1px solid #2c2c2c;padding-top:12px;margin-top:8px}
.price .t b{font-size:1.45rem}
.grid{display:grid;gap:10px}
@media(min-width:700px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);border-top:1px solid var(--line);display:flex}
.nav button{flex:1;border:0;background:none;padding:12px 0 16px;font-size:11px;color:#8a837a}
.nav button.on{color:var(--red);font-weight:700}
.hidden{display:none}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.strike{color:#9a948c;text-decoration:line-through;font-size:12px}
.ok{color:#1f7a3a;font-size:13px}
</style>
</head>
<body>
<div class="shell" id="app"></div>
<nav class="nav hidden" id="nav">
  <button data-go="home">Trang chủ</button>
  <button data-go="design">Thiết kế</button>
  <button data-go="build">Xây</button>
  <button data-go="interior">Nội thất</button>
  <button data-go="history">Hồ sơ</button>
</nav>
<script>
const VAT=0.08, MAIL="Huytu91@gmail.com", PHONE="0944437238";
const WEB="https://wotu.vn", FB="https://www.facebook.com/wotuani", ZALO="https://zalo.me/0944437238";
const VND=n=>Math.round(n).toLocaleString("vi-VN")+"đ";
const money=sub=>{const vat=Math.round(Math.max(0,sub)*VAT);return{sub:Math.max(0,sub),vat,total:Math.max(0,sub)+vat}};
const S={
  page:localStorage.wotu_c?"home":"welcome",
  c:JSON.parse(localStorage.wotu_c||"null"),
  quotes:JSON.parse(localStorage.wotu_q||"[]"),
  extra:null, msg:"",
  dPkg:"co-ban", dArea:80, dDone:false,
  house:"nha-ong", road:"o-to", w:4, l:10, land:40, bal:1,
  floors:[{k:"btct"},{k:"btct"}], bPkg:"trung-binh", confirm:false, bDone:false,
  open:{}, led:{},
  kh:{ke:0, op:"", giay:0, rem:0},
  bep:{duoi:"", tren:"", kich:"", canh:"melamine", mdD:0, mdT:0, mdK:0, da:"", op:"", lanh:"", lanhCanh:"melamine", bon:false},
  an:{tu:"", ban:"", m2:0},
  ngu:["master","n2","n3"].reduce((o,id)=>(o[id]={tu:"", canh:"", m2:0, giuong:"", hoc:0, tab:"", td:"", tdmd:0, rem:0},o),{}),
  tho:{vach:"", m2:0},
  acc:{}
};
const DESIGN=[
  {id:"tiet-kiem",name:"Tiết kiệm",price:79000},
  {id:"co-ban",name:"Cơ bản",price:119000},
  {id:"hoan-thien",name:"Hoàn thiện",price:179000}
];
const BUILD={
  normal:{ "co-ban":6e6,"trung-binh":7e6,"cao-cap":8e6 },
  villa:{ "co-ban":12e6,"trung-binh":16e6,"cao-cap":20e6 }
};
const BEP_BOX={mdf:{d:2100000,t:2000000,k:1800000},plywood:{d:2700000,t:2500000,k:2300000},nhua:{d:2900000,t:2700000,k:2500000}};
const DA={su:1900000,kimsa:1350000,lamar:1800000};
const OPB={su:1900000,kimsa:1350000,lamar:1800000,k8:850000,k6:780000};
const GARIS=[
  {id:"g-xoong",z:"bep",name:"Giá xoong / bát tủ dưới",goc:6090000},
  {id:"g-gia-vi",z:"bep",name:"Giá dao thớt – gia vị",goc:4180000},
  {id:"g-gao",z:"bep",name:"Thùng gạo",goc:3500000},
  {id:"g-rac",z:"bep",name:"Thùng rác",goc:2200000},
  {id:"g-goc",z:"bep",name:"Hệ góc / mâm xoay",goc:4200000},
  {id:"g-hut",z:"bep",name:"Máy hút mùi",goc:9590000},
  {id:"g-chau",z:"bep",name:"Chậu rửa",goc:4500000},
  {id:"g-voi",z:"bep",name:"Vòi rửa",goc:2650000},
  {id:"g-ao-gap",z:"ngu",name:"Ngăn kéo đồ gấp",goc:5300000},
  {id:"g-giay",z:"ngu",name:"Giá giày xoay",goc:8890000}
];
function seq(){const n=+(localStorage.wotu_n||0)+1;localStorage.wotu_n=n;return"WOTU-Q-"+String(n).padStart(6,"0")}
function go(p,extra){S.page=p;S.extra=extra||null;S.msg="";render()}
function head(back){
  return `<div class="top">
    <div class="brand"><div class="mark">W</div><div><b>WO<span>TU</span></b><small>Nội thất cho tổ ấm Việt</small></div></div>
    <div class="links">
      <a href="${WEB}" target="_blank" rel="noopener">wotu.vn</a>
      <a href="${FB}" target="_blank" rel="noopener">Facebook</a>
      <a href="tel:${PHONE}">Gọi Tú</a>
      <a href="${ZALO}" target="_blank" rel="noopener">Zalo</a>
    </div>
  </div>
  ${back?`<button class="btn btn-g" onclick="go('${back}')" style="width:auto;padding:8px 14px">← Quay lại</button>`:""}`;
}
function priceHTML(b){
  return `<div class="price">
    <div class="r"><span>Thành tiền chưa VAT</span><span>${VND(b.sub)}</span></div>
    <div class="r"><span>VAT 8%</span><span>${VND(b.vat)}</span></div>
    <div class="t"><span>Tổng cộng</span><b>${VND(b.total)}</b></div>
  </div>
  <p class="note">VAT 8% theo Nghị quyết 204/2025/QH15, áp đến 31/12/2026. Sau đó mặc định 10% nếu không gia hạn. Báo giá sơ bộ — chi tiết gọi ${PHONE} Tú.</p>`;
}
function actions(quote){
  return `<button class="btn btn-p" onclick='saveQ(${JSON.stringify(quote)})'>Lưu & gửi tư vấn</button>
  <a class="btn btn-g" href="${ZALO}" target="_blank" rel="noopener" style="display:block;text-align:center">Chat Zalo với Tú</a>
  <a class="btn btn-g" href="tel:${PHONE}" style="display:block;text-align:center">Gọi 0944 437 238</a>`;
}
async function sendMail(row){
  const body={
    _subject:"Lead WOTU "+row.code,
    ten:row.c.fullName, sdt:row.c.phone, diachi:row.c.address,
    ma:row.code, loai:row.quote.type, chitiet:row.quote.detail||"",
    chuaVAT:VND(row.quote.money.sub), vat:VND(row.quote.money.vat), tong:VND(row.quote.money.total)
  };
  try{
    await fetch("https://formsubmit.co/ajax/"+MAIL,{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify(body)
    });
    S.msg="Đã gửi yêu cầu về email WOTU.";
  }catch(e){
    location.href="mailto:"+MAIL+"?subject="+encodeURIComponent("Lead "+row.code)+"&body="+encodeURIComponent(JSON.stringify(body,null,2));
  }
}
function saveQ(quote){
  if(!S.c) return go("welcome");
  const row={code:seq(),c:S.c,quote,at:new Date().toISOString()};
  S.quotes.unshift(row); localStorage.wotu_q=JSON.stringify(S.quotes.slice(0,80));
  sendMail(row); go("done",row);
}
function welcome(){
  return `${head()}
  <h1>Phần mềm báo giá tự động</h1>
  <p class="lead">Xin chào quý khách đã đến với WOTU. Nhập thông tin để nhận báo giá sơ bộ.</p>
  <div class="card">
    <label>Họ và tên *<input id="fn" value="${S.c?.fullName||""}"></label>
    <label>Số điện thoại *<input id="ph" inputmode="tel" value="${S.c?.phone||""}"></label>
    <label>Địa chỉ *<input id="ad" value="${S.c?.address||""}"></label>
    <label style="display:flex;gap:10px;align-items:flex-start;font-weight:400">
      <input type="checkbox" id="ok" ${S.c?.consent?"checked":""} style="width:auto;margin-top:3px">
      Đồng ý để WOTU lưu thông tin nhằm lập báo giá và tư vấn.
    </label>
    <div class="err" id="er"></div>
    <button class="btn btn-p" onclick="submitC()">Tiếp tục</button>
  </div>
  <p class="note"><a href="${WEB}" target="_blank">wotu.vn</a> · <a href="${FB}" target="_blank">Facebook</a> · <a href="${ZALO}" target="_blank">Zalo Tú</a></p>`;
}
function submitC(){
  const fullName=fn.value.trim(), phone=ph.value.replace(/[\s.\-]/g,""), address=ad.value.trim(), consent=ok.checked, e=[];
  if(!fullName) e.push("Nhập họ tên.");
  if(!/^(0|\+84)(3|5|7|8|9)\d{8}$/.test(phone)) e.push("SĐT Việt Nam không hợp lệ.");
  if(!address) e.push("Nhập địa chỉ.");
  if(!consent) e.push("Cần đồng ý xử lý dữ liệu.");
  if(e.length){er.textContent=e.join(" ");return}
  S.c={fullName,phone,address,consent}; localStorage.wotu_c=JSON.stringify(S.c); go("home");
}
function home(){
  return `${head()}
  <p class="lead">Xin chào, <b>${S.c.fullName}</b>. Chọn hạng mục cần báo giá.</p>
  <div class="grid g3">
    <div class="card"><b>Thiết kế</b><p class="note">Ba gói thiết kế nhà.</p><button class="btn btn-p" onclick="go('design')">Bắt đầu</button></div>
    <div class="card"><b>Xây trọn gói</b><p class="note">Chìa khóa trao tay.</p><button class="btn btn-p" onclick="go('build')">Bắt đầu</button></div>
    <div class="card"><b>Nội thất</b><p class="note">Chọn khu, chọn món.</p><button class="btn btn-p" onclick="go('interior')">Bắt đầu</button></div>
  </div>`;
}
function design(){
  const pkg=DESIGN.find(p=>p.id===S.dPkg);
  const m=money((S.dArea||0)*pkg.price);
  return `${head("home")}<h1>Chi phí thiết kế</h1>
  <label>Gói thiết kế
    <select onchange="S.dPkg=this.value;S.dDone=false;render()">
      ${DESIGN.map(p=>`<option value="${p.id}" ${S.dPkg===p.id?"selected":""}>${p.name}</option>`).join("")}
    </select>
  </label>
  <label>Tổng diện tích (m²)<input type="number" min="1" value="${S.dArea}" oninput="S.dArea=+this.value;S.dDone=false"></label>
  <button class="btn btn-p" onclick="S.dDone=true;render()">Tính toán</button>
  ${S.dDone&&S.dArea>0?priceHTML(m)+actions({type:"Thiết kế",detail:"Gói "+pkg.name+" · "+S.dArea+"m²",money:m}):""}
  <button class="btn btn-g" onclick="go('home')">← Quay lại</button>`;
}
function calcBuild(){
  const unit=(S.house==="villa"?BUILD.villa:BUILD.normal)[S.bPkg];
  const base=S.land+S.w*Math.max(0,S.bal);
  let sub=0;
  S.floors.forEach(f=>{sub+=base*(f.k==="ton"?Math.max(0,unit-500000):unit)});
  if(S.road==="hem-nho") sub*=1.2;
  return money(Math.round(sub));
}
function build(){
  const mis=Math.abs(S.w*S.l-S.land)>0.05;
  const m=calcBuild();
  return `${head("home")}<h1>Xây dựng trọn gói</h1>
  <div class="grid g2">
    <label>Loại nhà
      <select onchange="S.house=this.value;S.bDone=false;render()">
        <option value="nha-ong" ${S.house==="nha-ong"?"selected":""}>Nhà ống</option>
        <option value="hai-mat-tien" ${S.house==="hai-mat-tien"?"selected":""}>Nhà 2 mặt tiền</option>
        <option value="mai-thai" ${S.house==="mai-thai"?"selected":""}>Nhà mái thái</option>
        <option value="villa" ${S.house==="villa"?"selected":""}>Villa / biệt thự</option>
      </select>
    </label>
    <label>Đường trước nhà
      <select onchange="S.road=this.value;S.bDone=false;render()">
        <option value="o-to">Đường ô tô</option>
        <option value="hem-lon" ${S.road==="hem-lon"?"selected":""}>Hẻm lớn</option>
        <option value="hem-nho" ${S.road==="hem-nho"?"selected":""}>Hẻm nhỏ</option>
      </select>
    </label>
    <label>Ngang (m)<input type="number" value="${S.w}" oninput="S.w=+this.value;S.confirm=false;S.bDone=false"></label>
    <label>Dài (m)<input type="number" value="${S.l}" oninput="S.l=+this.value;S.confirm=false;S.bDone=false"></label>
    <label>Diện tích đất (m²)<input type="number" value="${S.land}" oninput="S.land=+this.value;S.confirm=false;S.bDone=false"></label>
    <label>Ban công nhô (m)<input type="number" value="${S.bal}" oninput="S.bal=+this.value;S.bDone=false"></label>
  </div>
  <p class="note">Ngang × dài = ${(S.w*S.l).toFixed(2)} m². Ô tô và hẻm lớn cùng giá. Hẻm nhỏ +20%. Tôn giảm 500.000đ/m² so với sàn BTCT.</p>
  ${mis?`<div class="card"><p class="err" style="margin:0">Diện tích đất không khớp ngang × dài.</p>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" ${S.confirm?"checked":""} onchange="S.confirm=this.checked;render()"> Xác nhận dùng diện tích đất đã nhập</label></div>`:""}
  <label>Số sàn<input type="number" min="1" max="12" value="${S.floors.length}" oninput="const n=Math.max(1,+this.value||1);S.floors=Array.from({length:n},(_,i)=>S.floors[i]||{k:'btct'});S.bDone=false;render()"></label>
  ${S.floors.map((f,i)=>`<label>Sàn ${i+1}
    <select onchange="S.floors[${i}].k=this.value;S.bDone=false;render()">
      <option value="btct" ${f.k==="btct"?"selected":""}>Sàn / mái BTCT</option>
      <option value="ton" ${f.k==="ton"?"selected":""}>Lợp tôn</option>
    </select></label>`).join("")}
  <label>Gói
    <select onchange="S.bPkg=this.value;S.bDone=false;render()">
      <option value="co-ban" ${S.bPkg==="co-ban"?"selected":""}>Cơ bản</option>
      <option value="trung-binh" ${S.bPkg==="trung-binh"?"selected":""}>Trung bình</option>
      <option value="cao-cap" ${S.bPkg==="cao-cap"?"selected":""}>Cao cấp</option>
    </select>
  </label>
  <button class="btn btn-p" ${mis&&!S.confirm?"disabled":""} onclick="S.bDone=true;render()">Tính toán</button>
  ${S.bDone?priceHTML(m)+actions({type:"Xây dựng",detail:S.house+" · "+S.bPkg,money:m}):""}
  <button class="btn btn-g" onclick="go('home')">← Quay lại</button>`;
}
function ledBox(id){
  const md=S.led[id]||0;
  return `<label>Đèn LED (md)
    <input type="number" min="0" step="0.1" value="${md}" oninput="S.led['${id}']=+this.value||0">
  </label>
  <p class="note">250.000đ/md. Có LED thì tự thêm cảm biến nhấn mở 200.000đ/hệ.</p>`;
}
function ledMoney(id){const md=S.led[id]||0;return md>0?md*250000+200000:0}
function accMoney(z){
  let sub=0,sl=0;
  GARIS.filter(g=>g.z===z).forEach(g=>{
    const q=S.acc[g.id]||0; if(q>0){sub+=q*g.goc*0.6; sl+=q}
  });
  return sub+sl*150000;
}
function accUI(z){
  return GARIS.filter(g=>g.z===z).map(g=>`<label>${g.name} (bộ)
    <input type="number" min="0" value="${S.acc[g.id]||0}" oninput="S.acc['${g.id}']=+this.value||0">
    <span class="strike">${VND(g.goc)}</span> → <b>${VND(g.goc*0.6)}</b>
  </label>`).join("")+`<p class="note">Phụ kiện giảm 40%. Lắp 150.000đ × số lượng.</p>`;
}
function interiorSub(){
  let s=0;
  if(S.open.khach){
    s+=(S.kh.ke||0)*1650000+(S.kh.giay||0)*1900000+(S.kh.rem||0)*390000;
    s+=(S.kh.op==="mel"?750000:S.kh.op==="tre"?1200000:S.kh.op==="lam"?450000:0)*(S.kh.opm||0);
    s+=ledMoney("khach");
  }
  if(S.open.bep){
    const ac=S.bep.canh==="acrylic"?500000:0;
    const add=(kind,md,key)=>{if(!kind||!md)return 0;return md*((BEP_BOX[kind][key]||0)+ac)};
    s+=add(S.bep.duoi,S.bep.mdD,"d")+add(S.bep.tren,S.bep.mdT,"t")+add(S.bep.kich,S.bep.mdK,"k");
    if(S.bep.da) s+=(S.bep.mdDa||0)*(DA[S.bep.da]||0);
    if(S.bep.op) s+=(S.bep.mdOp||0)*(OPB[S.bep.op]||0);
    if(S.bep.lanh){
      const base=S.bep.lanh==="mdf"?2500000:S.bep.lanh==="plywood"?3300000:3500000;
      s+=base+(S.bep.lanhCanh==="acrylic"?500000:0);
    }
    if(S.bep.bon) s+=900000;
    s+=ledMoney("bep")+accMoney("bep");
  }
  if(S.open.an){
    if(S.an.tu==="mdf") s+=(S.an.m2||0)*2250000;
    if(S.an.tu==="nhom") s+=(S.an.m2||0)*2750000;
    if(S.an.ban==="4") s+=4000000;
    if(S.an.ban==="6") s+=6000000;
    s+=ledMoney("an");
  }
  ["master","n2","n3"].forEach(id=>{
    if(!S.open[id]) return;
    const n=S.ngu[id];
    let tu=n.tu==="mdf"?1950000:n.tu==="plywood"?2450000:n.tu==="nhua"?2650000:0;
    if(tu && (n.canh==="acrylic"||n.canh==="nhom")) tu+=900000;
    s+=(n.m2||0)*tu;
    s+=(n.giuong==="14"?4e6:n.giuong==="16"?43e5:n.giuong==="18"?46e5:n.giuong==="20"?5e6:0);
    s+=(n.hoc||0)*250000;
    s+=(n.tab==="nho"?900000:n.tab==="lon"?1200000:0);
    s+=(n.td==="dung"?3e6:n.td==="treo"?25e5:0)*(n.tdmd||0);
    s+=(n.rem||0)*390000;
    s+=ledMoney(id)+accMoney("ngu");
  });
  if(S.open.tho){
    s+=(S.tho.vach==="cnc"?1200000:S.tho.vach==="nano"?900000:0)*(S.tho.m2||0);
    s+=ledMoney("tho");
  }
  return s;
}
function room(id,title,inner){
  const on=!!S.open[id];
  return `<div class="card">
    <label style="display:flex;gap:10px;align-items:center;margin:0;font-weight:700">
      <input type="checkbox" style="width:auto" ${on?"checked":""} onchange="S.open['${id}']=this.checked;render()">
      ${title}
    </label>
    ${on?inner:`<p class="note">Chưa chọn khu này</p>`}
  </div>`;
}
function interior(){
  const m=money(interiorSub());
  const has=Object.values(S.open).some(Boolean);
  return `${head("home")}
  <h1>Nội thất</h1>
  <p class="lead"><b>Bạn cần làm nội thất vị trí gì?</b></p>
  ${room("khach","Phòng khách",`
    <label>Kệ TV (md)<input type="number" min="0" step="0.1" value="${S.kh.ke}" oninput="S.kh.ke=+this.value||0"></label>
    <label>Ốp tường
      <select onchange="S.kh.op=this.value;render()">
        <option value="">Không</option>
        <option value="mel" ${S.kh.op==="mel"?"selected":""}>MDF Melamine</option>
        <option value="tre" ${S.kh.op==="tre"?"selected":""}>Than tre</option>
        <option value="lam" ${S.kh.op==="lam"?"selected":""}>Lam sóng nano nhựa</option>
      </select>
    </label>
    ${S.kh.op?`<label>Diện tích ốp (m²)<input type="number" min="0" step="0.1" value="${S.kh.opm||0}" oninput="S.kh.opm=+this.value||0"></label>`:""}
    <label>Tủ giày (m²)<input type="number" min="0" step="0.1" value="${S.kh.giay}" oninput="S.kh.giay=+this.value||0"></label>
    <label>Rèm 2 lớp (m²)<input type="number" min="0" step="0.1" value="${S.kh.rem}" oninput="S.kh.rem=+this.value||0"></label>
    ${ledBox("khach")}`)}
  ${room("bep","Bếp",`
    <label>Tủ dưới
      <select onchange="S.bep.duoi=this.value;render()"><option value="">Không</option><option value="mdf">MDF</option><option value="plywood">Plywood</option><option value="nhua">Nhựa</option></select>
    </label>
    ${S.bep.duoi?`<label>Md tủ dưới<input type="number" min="0" step="0.1" value="${S.bep.mdD}" oninput="S.bep.mdD=+this.value||0"></label>`:""}
    <label>Tủ trên
      <select onchange="S.bep.tren=this.value;render()"><option value="">Không</option><option value="mdf">MDF</option><option value="plywood">Plywood</option><option value="nhua">Nhựa</option></select>
    </label>
    ${S.bep.tren?`<label>Md tủ trên<input type="number" min="0" step="0.1" value="${S.bep.mdT}" oninput="S.bep.mdT=+this.value||0"></label>`:""}
    <label>Tủ kịch trần
      <select onchange="S.bep.kich=this.value;render()"><option value="">Không</option><option value="mdf">MDF</option><option value="plywood">Plywood</option><option value="nhua">Nhựa</option></select>
    </label>
    ${S.bep.kich?`<label>Md kịch trần<input type="number" min="0" step="0.1" value="${S.bep.mdK}" oninput="S.bep.mdK=+this.value||0"></label>`:""}
    <label>Cánh
      <select onchange="S.bep.canh=this.value"><option value="melamine">Melamine</option><option value="acrylic" ${S.bep.canh==="acrylic"?"selected":""}>Acrylic bóng gương</option></select>
    </label>
    <label>Mặt đá
      <select onchange="S.bep.da=this.value;render()"><option value="">Không</option><option value="su">Đá sứ</option><option value="kimsa">Đá kim sa</option><option value="lamar">Đá lamar</option></select>
    </label>
    ${S.bep.da?`<label>Md mặt đá<input type="number" min="0" step="0.1" value="${S.bep.mdDa||0}" oninput="S.bep.mdDa=+this.value||0"></label>`:""}
    <label>Ốp đứng
      <select onchange="S.bep.op=this.value;render()"><option value="">Không</option><option value="su">Đá sứ</option><option value="kimsa">Đá kim sa</option><option value="lamar">Đá lamar</option><option value="k8">Kính sơn 8li</option><option value="k6">Kính sơn 6li</option></select>
    </label>
    ${S.bep.op?`<label>Md ốp đứng<input type="number" min="0" step="0.1" value="${S.bep.mdOp||0}" oninput="S.bep.mdOp=+this.value||0"></label>`:""}
    <label>Khung tủ lạnh
      <select onchange="S.bep.lanh=this.value;render()"><option value="">Không</option><option value="mdf">MDF</option><option value="plywood">Plywood</option><option value="nhua">Nhựa</option></select>
    </label>
    ${S.bep.lanh?`<label>Cánh khung lạnh
      <select onchange="S.bep.lanhCanh=this.value"><option value="melamine">Melamine</option><option value="acrylic" ${S.bep.lanhCanh==="acrylic"?"selected":""}>Acrylic</option></select>
    </label>`:""}
    ${S.bep.duoi==="mdf"||S.bep.tren==="mdf"||S.bep.kich==="mdf"?`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" ${S.bep.bon?"checked":""} onchange="S.bep.bon=this.checked"> Thùng nhựa bồn rửa (900.000đ/bộ)</label>`:""}
    ${ledBox("bep")}${accUI("bep")}`)}
  ${room("an","Phòng ăn",`
    <label>Tủ rượu
      <select onchange="S.an.tu=this.value;render()"><option value="">Không</option><option value="mdf">MDF cánh kính MDF</option><option value="nhom">Cánh nhôm kính</option></select>
    </label>
    ${S.an.tu?`<label>Diện tích (m²)<input type="number" min="0" step="0.1" value="${S.an.m2}" oninput="S.an.m2=+this.value||0"></label>`:""}
    <label>Bàn ăn sắt mặt đá, ghế sắt bọc nệm
      <select onchange="S.an.ban=this.value"><option value="">Không</option><option value="4" ${S.an.ban==="4"?"selected":""}>4 ghế — 4.000.000đ</option><option value="6" ${S.an.ban==="6"?"selected":""}>6 ghế — 6.000.000đ</option></select>
    </label>
    ${ledBox("an")}`)}
  ${["master","n2","n3"].map((id,i)=>room(id,"Phòng ngủ "+(i===0?"master":i+1), nguUI(id))).join("")}
  ${room("tho","Phòng thờ",`
    <label>Vách / ốp
      <select onchange="S.tho.vach=this.value;render()"><option value="">Không</option><option value="cnc">CNC MDF sơn cạnh</option><option value="nano">Nano lam + họa tiết CNC</option></select>
    </label>
    ${S.tho.vach?`<label>Diện tích (m²)<input type="number" min="0" step="0.1" value="${S.tho.m2}" oninput="S.tho.m2=+this.value||0"></label>`:""}
    <p class="note">Bàn thờ tùy kiểu — giá báo sau qua Zalo / điện thoại Tú.</p>
    ${ledBox("tho")}`)}
  <button class="btn btn-p" ${has?"":"disabled"} onclick="S.iDone=true;render()">Tính toán</button>
  ${S.iDone&&has?priceHTML(m)+actions({type:"Nội thất",detail:"Theo khu đã chọn",money:m}):""}
  <button class="btn btn-g" onclick="go('home')">← Quay lại</button>`;
}
function nguUI(id){
  const n=S.ngu[id];
  return `<label>Tủ áo
    <select onchange="S.ngu.${id}.tu=this.value;render()"><option value="">Không</option><option value="mdf">MDF</option><option value="plywood">Plywood</option><option value="nhua">Nhựa</option></select>
  </label>
  ${n.tu?`<label>Cánh tủ áo
    <select onchange="S.ngu.${id}.canh=this.value"><option value="">Mặc định</option><option value="acrylic">Acrylic +900k/m²</option><option value="nhom">Nhôm kính +900k/m²</option></select>
  </label>
  <label>Diện tích tủ (m²)<input type="number" min="0" step="0.1" value="${n.m2}" oninput="S.ngu.${id}.m2=+this.value||0"></label>`:""}
  <label>Giường
    <select onchange="S.ngu.${id}.giuong=this.value"><option value="">Không</option><option value="14">1m4</option><option value="16">1m6</option><option value="18">1m8</option><option value="20">2m</option></select>
  </label>
  <label>Hộc kéo (cái)<input type="number" min="0" value="${n.hoc}" oninput="S.ngu.${id}.hoc=+this.value||0"></label>
  <label>Tab
    <select onchange="S.ngu.${id}.tab=this.value"><option value="">Không</option><option value="nho">Nhỏ</option><option value="lon">Lớn</option></select>
  </label>
  <label>Bàn trang điểm
    <select onchange="S.ngu.${id}.td=this.value;render()"><option value="">Không</option><option value="dung">Đứng</option><option value="treo">Treo</option></select>
  </label>
  ${n.td?`<label>Md trang điểm<input type="number" min="0" step="0.1" value="${n.tdmd}" oninput="S.ngu.${id}.tdmd=+this.value||0"></label>`:""}
  <label>Rèm 2 lớp (m²)<input type="number" min="0" step="0.1" value="${n.rem}" oninput="S.ngu.${id}.rem=+this.value||0"></label>
  ${ledBox(id)}${id==="master"?accUI("ngu"):""}`;
}
function history(){
  if(!S.quotes.length) return `${head("home")}<h1>Hồ sơ</h1><p class="lead">Chưa có báo giá.</p>`;
  return `${head("home")}<h1>Hồ sơ</h1>`+S.quotes.map(q=>`<div class="card"><div class="row"><b>${q.code}</b><span>${VND(q.quote.money.total)}</span></div><p class="note">${q.quote.type} · ${q.c.fullName} · ${q.c.phone}<br>${new Date(q.at).toLocaleString("vi-VN")}</p></div>`).join("");
}
function done(){
  const q=S.extra; if(!q) return history();
  return `${head("history")}
  <p class="note">Báo giá sơ bộ WOTU</p>
  <h1>${q.code}</h1>
  ${S.msg?`<p class="ok">${S.msg}</p>`:""}
  <div class="card"><b>${q.c.fullName}</b><p class="note">${q.c.phone}<br>${q.c.address}</p></div>
  <div class="card"><b>${q.quote.type}</b><p class="note">${q.quote.detail||""}</p></div>
  ${priceHTML(q.quote.money)}
  <a class="btn btn-p" href="${ZALO}" target="_blank" rel="noopener" style="display:block;text-align:center">Tiếp tục trên Zalo</a>
  <button class="btn btn-g" onclick="go('home')">Làm báo giá khác</button>`;
}
function render(){
  const map={welcome,home,design,build,interior,history,done};
  app.innerHTML=(map[S.page]||home)();
  nav.className=S.page==="welcome"?"nav hidden":"nav";
  [...nav.querySelectorAll("button")].forEach(b=>b.className=b.dataset.go===S.page?"on":"");
}
nav.onclick=e=>{if(e.target.dataset.go) go(e.target.dataset.go)};
render();
</script>
</body>
</html>
