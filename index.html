<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WOTU — Báo giá</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f3efe8;color:#161616}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 96px}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;border:1px solid #e8e0d6}
input,textarea,select{width:100%;padding:12px;margin-top:6px;border:1px solid #ddd;border-radius:12px;font:inherit;box-sizing:border-box}
.btn{width:100%;padding:14px;border:0;border-radius:999px;background:#111;color:#fff;font-weight:700;margin-top:10px}
.btn2{background:#fff;color:#111;border:1px solid #ddd}
a{color:#8f1d1d}
.err{color:#8f1d1d;white-space:pre-wrap}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid #eee}
.nav button{flex:1;border:0;background:0;padding:14px;font-size:12px}
</style>
</head>
<body>
<div class="wrap" id="app">
 <h1>WOTU</h1>
 <p>Đang tải ứng dụng… Nếu chữ này không đổi sau 2 giây, script chưa chạy.</p>
</div>
<nav class="nav">
 <button type="button" id="n1">Trang chủ</button>
 <button type="button" id="n2">Thiết kế</button>
 <button type="button" id="n3">Nội thất</button>
</nav>
<script>
(function(){
try{
var VAT=0.08, MAIL="Huytu91@gmail.com", PHONE="0944437238";
var WEB="https://wotu.vn", FB="https://www.facebook.com/wotuani", ZALO="https://zalo.me/0944437238";
function VND(n){return Math.round(n).toLocale String("vi-VN")+"đ"}
function money(s){s=Math.max(0,Math.round(s));var v=Math.round(s*VAT);return {sub:s,vat:v,total:s+v}}
function jget(k,d){try{var x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}}
function jset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var S={page:"welcome",c:jget("wotu_c",null),quotes:jget("wotu_q",[]),dText:"Căn hộ 65m2 gói cơ bản",iText:"Làm bếp 3m, tủ đồ 1m9"};
if(S.c&&S.c.fullName) S.page="home";
var PKG={
 "tiet-kiem":{name:"Tiết kiệm",p:79000},
 "co-ban":{name:"Cơ bản",p:119000},
 "hoan-thien":{name:"Hoàn thiện",p:179000}
};
function el(html){document.getElementById("app").innerHTML=html}
function go(p){S.page=p;draw()}
function top(){
 return '<p><a href="'+WEB+'">wotu.vn</a> · <a href="'+FB+'">Facebook</a> · <a href="'+ZALO+'">Zalo</a> · <a href="tel:'+PHONE+'">'+PHONE+'</a></p>';
}
function send(row){
 fetch("https://formsubmit.co/ajax/"+MAIL,{
 method:"POST",
 headers:{"Content-Type":"application/json","Accept":"application/json"},
 body:JSON.stringify({_subject:"Lead "+row.code,ten:row.c.fullName,sdt:row.c.phone,tong:VND(row.quote.total)})
 }).catch(function(){});
}
function save(q){
 if(!S.c){go("welcome");return}
 var n=(Number(localStorage.getItem("wotu_n")||0)+1);localStorage.setItem("wotu_n",n);
 var row={code:"WOTU-Q-"+String(n).padStart(6,"0"),c:S.c,quote:q,at:new Date().toISOString()};
 S.quotes.unshift(row);jset("wotu_q",S.quotes.slice(0,50));
 send(row);S.last=row;go("done");setTimeout(function(){window.print()},400);
}
window.submitC=function(){
 var name=document.getElementById("fn").value.trim();
 var phone=document.getElementById("ph").value.replace(/[\s.\-]/g,"");
 var address=document.getElementById("ad").value.trim();
 var ok=document.getElementById("ok").checked;
 var e="";
 if(!name)e+="Nhập họ tên. ";
 if(!/^(0|\+84)(3|5|7|8|9)\d{8}$/.test(phone))e+="SĐT không hợp lệ. ";
 if(!address)e+="Nhập địa chỉ. ";
 if(!ok)e+="Cần đồng ý dữ liệu. ";
 document.getElementById("er").textContent=e;
 if(e)return;
 S.c={fullName:name,phone:phone,address:address,consent:true};jset(" wotu_c",S.c);go("home");
};
window.doDesign=function(){
 var t=document.getElementById("dt").value.toLowerCase().replace(",",".");
 S.dText=document.getElementById("dt").value;
 var m=t.match(/(\d+(?:\.\d+)?)\s*m\s*2/)||t.match(/(\d+(?:\.\d+)?)\s*m²/);
 var area=m?Number(m[1]):0;
 var pkg="co-ban";
 if(t.indexOf("tiết kiệm")>=0||t.indexOf("tiet kiem")>=0)pkg="tiet-kiem";
 if(t.indexOf("hoàn thiện")>=0||t.indexOf("hoan thien")>=0)pkg="hoan-thien";
 if(area<30){S.dRes={err:area?"Dưới 30m², liên hệ Tú.":"Nhập diện tích, ví dụ 65m2"};draw();return}
 var g=PKG[pkg], mon=money(area*g.p);
 S.dRes={ok:1,name:g.name,area:area,mon:mon};draw();
};
window.doInterior=function(){
 var t=document.getElementById("it").value.toLowerCase();
 S.iText=document.getElementById("it").value;
 var bw=t.match(/bếp[^0-9]{0,10}(\d+[.,]?\d*)\s*m/);
 var w=bw?Number(bw[1].replace(",",".")):0;
 var lines=[],sub=0;
 if(w){
 lines.push(["Tủ bếp dưới — MDF Melamine, ngang "+w+"m",w*2100000]);
 lines.push(["Tủ bếp trên — MDF Melamine, ngang "+w+"m",w*2000000]);
 lines.push(["Mặt đá kim sa, dài "+w+"m",w*1350000]);
 lines.push(["Kính ốp 8li, dài "+w+"m",w*850000]);
 lines.push(["LED + cảm biến",w*250000+200000]);
 }
 var tu=t.match(/tủ[^0-9]{0,12}(\d+[.,]?\d*)\s*m/);
 if(tu){
 var tv=Number(tu[1].replace(",","."));
 lines.push(["Tủ áo ngủ master — MDF, theo kích thước "+tv+"m (hỏi cao nếu là ngang)",tv*1950000]);
 }
 if(!lines.length){S.iRes={err:"Chưa đọc được bếp / tủ. Thử: làm bếp 3m, tủ đồ 1m9"};draw();return}
 for(var i=0;i<lines.length;i++)sub+=lines[i][1];
 S.iRes={ok:1,lines:lines,mon:money(sub)};draw();
};
function draw(){
 var h=top();
 if(S.page==="welcome"){
 h+="<h1>WOTU</h1><p>Báo giá thiết kế và nội thất.</p><div class='card'>";
 h+="<div>Họ tên *</div><input id='fn'>";
 h+="<div>SĐT *</div><input id='ph' inputmode='tel'>";
 h+="<div>Địa chỉ *</div><input id='ad'>";
 h+="<label><input type='checkbox' id='ok'> Đồng ý lưu thông tin tư vấn</label>";
 h+="<div class='err' id='er'></div><button class='btn' onclick='submitC()'>Tiếp tục</button></div>";
 }else if(S.page==="home"){
 h+="<p>Xin chào <b>"+(S.c&&S.c.fullName?S.c.fullName:"")+"</b></p>";
 h+="<div class='card'><b>Thiết kế</b><br><button class='btn' onclick='go(\"design\")'>Mở</button></div>";
 h+="<div class='card'><b>Nội thất</b><br><button class='btn' onclick='go(\"interior\")'>Mở</button></div>";
 }else if(S.page==="design"){
 h+="<h1>Thiết kế</h1><textarea id='dt'>"+S.dText+"</textarea><button class='btn' onclick='doDesign()'>Phân tích</button>";
 if(S.dRes&&S.dRes.err)h+="<div class='card err'>"+S.dRes.err+"</div>";
 if(S.dRes&&S.dRes.ok){
 h+="<div class='card'><b>"+S.dRes.name+" · "+S.dRes.area+" m²</b>";
 h+="<p>Chưa VAT "+VND(S.dRes.mon.sub)+"<br>VAT 8% "+VND(S.dRes.mon.vat)+"<br><b>Tổng "+VND(S.dRes. mon.total)+"</b></p>";
 h+="<button class='btn' onclick='save({type:\"Thiết kế\",total:"+S.dRes.mon.total+"})'>Tải PDF</button></div>";
 }
 h+="<button class='btn btn2' onclick='go(\"home\")'>Quay lại</button>";
 }else if(S.page==="interior"){
 h+="<h1>Nội thất</h1><textarea id='it'>"+S.iText+"</textarea><button class='btn' onclick='doInterior()'>Phân tích</button>";
 if(S.iRes&&S.iRes.err)h+="<div class='card err'>"+S.iRes.err+"</div>";
 if(S.iRes&&S.iRes.ok){
 h+="<div class='card'>";
 for(var i=0;i<S.iRes.lines.length;i++)h+="<div>"+S.iRes.lines[i][0]+" — <b>"+VND(S.iRes.lines[i][1])+"</b></div>";
 h+="<p>VAT 8% "+VND(S.iRes.mon.vat)+"<br><b>Tổng "+VND(S.iRes.mon.total)+"</b></p>";
 h+="<button class='btn' onclick='save({type:\"Nội thất\",total:"+S.iRes.mon.total+"})'>Tải PDF</button></div>";
 }
 h+="<button class='btn btn2' onclick='go(\"home\")'>Quay lại</button>";
 }else if(S.page==="done"){
 h+="<h1>"+(S.last&&S.last.code)+"</h1><p>Đã lưu. In → Save as PDF.</p><button class='btn btn2' onclick='go(\"home\")'>Về trang chủ</button>";
 }
 el(h);
}
document.getElementById("n1").onclick=function(){go(S.c?"home":"welcome")};
document.getElementById("n2").onclick=function(){go("design")};
document.getElementById("n3").onclick=function(){go("interior")};
draw();
}catch(err){
 document.getElementById("app").innerHTML="<h1>WOTU</h1><p class='err'>Lỗi JS:\n"+err.message+"</p>";
}
})();
</script>
</body>
</html>
