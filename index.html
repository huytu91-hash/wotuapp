<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="light"/>
<title>WOTU</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Be Vietnam Pro",sans-serif;background:#f3efe8;color:#161616}
.w{max-width:900px;margin:0 auto;padding:20px 16px 48px}
.brand{display:flex;gap:12px;align-items:center}
.brand img{height:44px;width:auto;display:block}
.mk{width:46px;height:46px;border-radius:14px;background:#111;color:#fff;display:none;place-items:center;font-weight:800}
h1{font-size:28px;letter-spacing:-.03em;margin:12px 0 8px}
.muted,.note{color:#6d665e;line-height:1.6}
.note{font-size:12px;margin-top:10px}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;border:1px solid #ece5dc}
.pkg{border:1px solid #e8e0d6;border-radius:16px;padding:14px;margin:8px 0}
.pkg.on{border-color:#111;box-shadow:0 0 0 2px #111}
.row{display:flex;justify-content:space-between;gap:8px}
label{display:block;margin:10px 0 0;font-size:13px;font-weight:500}
input,select,textarea{width:100%;margin-top:6px;padding:12px;border:1px solid #e4ddd4;border-radius:12px;font:inherit}
.btn{width:100%;border:0;border-radius:999px;padding:13px;margin-top:10px;background:#111;color:#fff;font:inherit;font-weight:700}
.btn2{background:#fff;color:#111;border:1px solid #ddd}
a{color:#8f1d1d;text-decoration:none}
.tot{background:#111;color:#fff;border-radius:16px;padding:16px}
.line{padding:10px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:10px}
@media print{.noprint{display:none!important}}
</style>
</head>
<body>
<div class="w" id="app">WOTU</div>
<script>
var PHONE="0944437238", MAIL="Huytu91@gmail.com";
var WEB="https://wotu.vn", FB="https://www.facebook.com/wotuani", ZALO="https://zalo.me/0944437238";
var MAT=[
  {id:"mdf_mel",name:"MDF chống ẩm phủ Melamine"},
  {id:"ply_mel",name:"Plywood phủ Melamine"},
  {id:"mdf_acr",name:"MDF chống ẩm phủ Acrylic"},
  {id:"nhua_film",name:"Nhựa đặc phủ film"},
  {id:"nhua_acr",name:"Nhựa đặc phủ Acrylic"}
];
var ACC=[
  {id:"xoong",z:"bep",name:"Giá xoong / bát tủ dưới",goc:6090000,sug:1},
  {id:"giavi",z:"bep",name:"Giá dao thớt – gia vị",goc:4180000,sug:0},
  {id:"tayrua",z:"bep",name:"Giá tẩy rửa",goc:2680000,sug:0},
  {id:"goc",z:"bep",name:"Hệ góc / mâm xoay",goc:4200000,sug:0},
  {id:"kho",z:"bep",name:"Tủ đồ khô",goc:8000000,sug:0},
  {id:"gao",z:"bep",name:"Thùng gạo",goc:3500000,sug:0},
  {id:"rac",z:"bep",name:"Thùng rác",goc:2200000,sug:1},
  {id:"hut",z:"bep",name:"Máy hút mùi",goc:9590000,sug:1},
  {id:"chau",z:"bep",name:"Chậu rửa",goc:4500000,sug:1},
  {id:"voi",z:"bep",name:"Vòi rửa",goc:2650000,sug:1},
  {id:"nang",z:"bep",name:"Hệ nâng hạ tủ trên",goc:11290000,sug:0},
  {id:"suot",z:"master",name:"Suốt treo quần áo",goc:450000,sug:1},
  {id:"gap",z:"master",name:"Ngăn kéo đồ gấp",goc:5300000,sug:0},
  {id:"trangsuc",z:"master",name:"Ngăn kéo trang sức",goc:5000000,sug:0},
  {id:"quan",z:"master",name:"Giá treo quần",goc:3300000,sug:0},
  {id:"lot",z:"master",name:"Ngăn để lót",goc:5700000,sug:0},
  {id:"giay",z:"master",name:"Giá giày xoay",goc:8890000,sug:1}
];
var S={page:"welcome",c:null,dPkg:"tiet-kiem",dArea:80,dShow:0,ai:"",ask:null,
  rooms:{khach:0,bep:1,an:0,master:1,n2:0,n3:0,tho:0},
  bepW:3,bepDuoi:"mdf_mel",bepTren:"mdf_mel",da:"kimsa",op:"k8",ledB:1,kich:0,lanh:"",bon:0,
  kh:{ke:0,op:"",opm:0,giay:0,rem:0,led:0},
  an:{tu:"",m2:0,ban:"",led:0},
  ngu:{master:{m2:4.6,mat:"mdf_mel",nk:0,bed:"",hoc:0,tab:"",td:"",tdmd:0,rem:0,led:0},
       n2:{m2:0,mat:"mdf_mel",nk:0,bed:"",hoc:0,tab:"",td:"",tdmd:0,rem:0,led:0},
       n3:{m2:0,mat:"mdf_mel",nk:0,bed:"",hoc:0,tab:"",td:"",tdmd:0,rem:0,led:0}},
  tho:{vach:"",m2:0,led:0},
  acc:{},iShow:0,last:null};
function vnd(n){return Math.round(n).toLocaleString("vi-VN")+"đ"}
function mon(s){s=Math.max(0,Math.round(s));var v=Math.round(s*0.08);return {s:s,v:v,t:s+v}}
function go(p){S.page=p;draw()}
function load(){try{var x=localStorage.getItem("wotu_c");S.c=x?JSON.parse(x):null;if(S.c)S.page="home";}catch(e){}}
function mn(id){for(var i=0;i<MAT.length;i++)if(MAT[i].id===id)return MAT[i].name;return MAT[0].name}
function sel(id,val){var h="<select id='"+id+"'>";for(var i=0;i<MAT.length;i++)h+="<option value='"+MAT[i].id+"'"+(val===MAT[i].id?" selected":"")+">"+MAT[i].name+"</option>";return h+"</select>"}
function logo(){
  return '<div class="brand"><img src="logo.png" alt="WOTU" onerror="this.style.display=\'none\';document.getElementById(\'mk\').style.display=\'grid\'"><div class="mk" id="mk">W</div><div><b>WOTU</b><div class="muted">Nội thất cho tổ ấm Việt</div></div></div><p class="muted noprint"><a href="'+WEB+'">wotu.vn</a> · <a href="'+FB+'">Facebook</a> · <a href="'+ZALO+'">Zalo</a></p>';
}
function notes(){
  return '<p class="note"><b>Ghi chú.</b> Đây là báo giá sơ bộ, chỉ mang tính tham khảo, chưa phải hợp đồng. Thành tiền có thể điều chỉnh sau khảo sát hiện trạng và chốt vật tư. Đã gồm VAT 8% theo Nghị quyết 204/2025/QH15 (đến 31/12/2026). Chưa gồm vận chuyển ngoại tỉnh, tháo dỡ hiện trạng và hạng mục phát sinh. Chi tiết: '+PHONE+' — Tú.</p>'
    +'<p class="note"><b>Vật liệu áp dụng.</b> MDF chống ẩm phủ Melamine và Plywood phủ Melamine: ACCPANEL, KES S6, Mộc Phát, BMH. Phủ Acrylic (MDF hoặc nhựa đặc): LIVAS, ALD. Nhựa đặc phủ film hoặc phủ Acrylic theo định mức WOTU. An Cường, Minh Long: liên hệ để báo giá lại.</p>';
}
function tot(m){return '<div class="tot"><div class="row"><span>Chưa VAT</span><span>'+vnd(m.s)+'</span></div><div class="row"><span>VAT 8%</span><span>'+vnd(m.v)+'</span></div><div class="row"><b>Tổng</b><b>'+vnd(m.t)+'</b></div></div>'+notes()}
function send(code,loai,tong){fetch("https://formsubmit.co/ajax/"+MAIL,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({_subject:"Lead "+code,ten:S.c.fullName,sdt:S.c.phone,loai:loai,tong:vnd(tong)})}).catch(function(){})}
function pdf(loai,tong){
  if(!S.c){go("welcome");return;}
  var n=1;try{n=+localStorage.getItem("wotu_n")||0;n++;localStorage.setItem("wotu_n",n);}catch(e){}
  S.last={code:"WOTU-Q-"+("000000"+n).slice(-6),loai:loai,tong:tong};
  send(S.last.code,loai,tong);S.page="done";draw();setTimeout(function(){print()},400);
}
function start(){
  var a=document.getElementById("fn").value.trim(),b=document.getElementById("ph").value.replace(/[\s.\-]/g,""),c=document.getElementById("ad").value.trim(),e="";
  if(!a)e+="Nhập họ tên. "; if(!/^(0|\+84)(3|5|7|8|9)\d{8}$/.test(b))e+="SĐT không đúng. "; if(!c)e+="Nhập địa chỉ. "; if(!document.getElementById("ok").checked)e+="Cần đồng ý. ";
  document.getElementById("er").textContent=e; if(e)return;
  S.c={fullName:a,phone:b,address:c}; try{localStorage.setItem("wotu_c",JSON.stringify(S.c));}catch(e2){} go("home");
}
function pkgP(){return S.dPkg==="co-ban"?119000:S.dPkg==="hoan-thien"?179000:79000}
function pkgN(){return S.dPkg==="co-ban"?"Cơ bản":S.dPkg==="hoan-thien"?"Hoàn thiện":"Tiết kiệm"}
function pkgI(){
  if(S.dPkg==="co-ban") return "Toàn bộ hạng mục gói Tiết kiệm. Bản vẽ 2D chi tiết kích thước. Chỉ định vật liệu nội thất. Bản vẽ 2D ổ cắm điện, nước.";
  if(S.dPkg==="hoan-thien") return "Toàn bộ hạng mục gói Cơ bản. Hồ sơ kết cấu xây dựng. Phối cảnh 3D mặt đứng, mặt tiền. Hồ sơ bàn giao hoàn chỉnh.";
  return "Mặt bằng công năng 2D. Phối cảnh 3D nội thất các không gian chính.";
}
function boxP(id){return {mdf_mel:2100000,ply_mel:2700000,mdf_acr:2600000,nhua_film:2900000,nhua_acr:3400000}[id]||2100000}
function topP(id){return {mdf_mel:2000000,ply_mel:2500000,mdf_acr:2500000,nhua_film:2700000,nhua_acr:3200000}[id]||2000000}
function tuP(id){return {mdf_mel:1950000,ply_mel:2450000,mdf_acr:2850000,nhua_film:2650000,nhua_acr:3550000}[id]||1950000}
function daP(k){return k==="su"?1900000:k==="lamar"?1800000:k==="khong"?0:1350000}
function opP(k){return k==="k6"?780000:k==="kimsa"?1350000:k==="khong"?0:850000}
function lanhP(id){return {mdf_mel:2500000,ply_mel:3300000,mdf_acr:3000000,nhua_film:3500000,nhua_acr:4000000}[id]||0}
function sugAcc(){
  ACC.forEach(function(a){ if(a.sug && ((a.z==="bep"&&S.rooms.bep)||(a.z==="master"&&S.rooms.master))) S.acc[a.id]=1; });
}
function applyAI(){
  var t=document.getElementById("ai").value.toLowerCase(); S.ai=t; S.ask=null;
  var m=t.match(/(\d+[.,]?\d*)\s*m\s*2/); if(m)S.dArea=+m[1].replace(",",".");
  if(/tiết kiệm/.test(t))S.dPkg="tiet-kiem";
  else if(/cơ bản/.test(t))S.dPkg="co-ban";
  else if(/hoàn thiện/.test(t))S.dPkg="hoan-thien";
  var b=t.match(/bếp[^0-9]{0,12}(\d+[.,]?\d*)/); if(b){S.rooms.bep=1;S.bepW=+b[1].replace(",",".");}
  var u=t.match(/tủ[^0-9]{0,14}(\d+[.,]?\d*)\s*(m2|m²|m)?/);
  if(u){
    var val=+u[1].replace(",",".");
    if(!u[2] || u[2]==="m"){S.ask={v:val};draw();return;}
    S.rooms.master=1;S.ngu.master.m2=val;
  }
  if(/khách/.test(t))S.rooms.khach=1;
  if(/ăn/.test(t))S.rooms.an=1;
  if(/thờ/.test(t))S.rooms.tho=1;
  if(/plywood/.test(t)){S.bepDuoi=S.bepTren="ply_mel";S.ngu.master.mat="ply_mel";}
  else if(/nhựa/.test(t)&&/acrylic|bóng/.test(t)){S.bepDuoi=S.bepTren="nhua_acr";S.ngu.master.mat="nhua_acr";}
  else if(/nhựa/.test(t)){S.bepDuoi=S.bepTren="nhua_film";S.ngu.master.mat="nhua_film";}
  else if(/acrylic/.test(t)){S.bepDuoi=S.bepTren="mdf_acr";S.ngu.master.mat="mdf_acr";}
  sugAcc(); draw();
}
function setCao(){
  var h=+document.getElementById("cao").value||2.4;
  S.rooms.master=1; S.ngu.master.m2=+(S.ask.v*h).toFixed(2); S.ask=null; sugAcc(); draw();
}
function grab(){
  function g(id){return document.getElementById(id)}
  if(g("dArea"))S.dArea=+g("dArea").value||0;
  if(g("bepW"))S.bepW=+g("bepW").value||0;
  if(g("bepDuoi"))S.bepDuoi=g("bepDuoi").value;
  if(g("bepTren"))S.bepTren=g("bepTren").value;
  if(g("da"))S.da=g("da").value;
  if(g("op"))S.op=g("op").value;
  if(g("lanh"))S.lanh=g("lanh").value;
  if(g("kich"))S.kich=g("kich").checked?1:0;
  if(g("ledB"))S.ledB=g("ledB").checked?1:0;
  if(g("bon"))S.bon=g("bon").checked?1:0;
  if(g("ke"))S.kh.ke=+g("ke").value||0;
  if(g("khop"))S.kh.op=g("khop").value;
  if(g("opm"))S.kh.opm=+g("opm").value||0;
  if(g("giay"))S.kh.giay=+g("giay").value||0;
  if(g("krem"))S.kh.rem=+g("krem").value||0;
  if(g("antu"))S.an.tu=g("antu").value;
  if(g("anm2"))S.an.m2=+g("anm2").value||0;
  if(g("anban"))S.an.ban=g("anban").value;
  if(g("thov"))S.tho.vach=g("thov").value;
  if(g("thom2"))S.tho.m2=+g("thom2").value||0;
  ["master","n2","n3"].forEach(function(id){
    if(g("tu"+id))S.ngu[id].m2=+g("tu"+id).value||0;
    if(g("mat"+id))S.ngu[id].mat=g("mat"+id).value;
    if(g("nk"+id))S.ngu[id].nk=g("nk"+id).checked?1:0;
    if(g("bed"+id))S.ngu[id].bed=g("bed"+id).value;
    if(g("hoc"+id))S.ngu[id].hoc=+g("hoc"+id).value||0;
    if(g("tab"+id))S.ngu[id].tab=g("tab"+id).value;
    if(g("td"+id))S.ngu[id].td=g("td"+id).value;
    if(g("tdmd"+id))S.ngu[id].tdmd=+g("tdmd"+id).value||0;
    if(g("rem"+id))S.ngu[id].rem=+g("rem"+id).value||0;
    if(g("led"+id))S.ngu[id].led=+g("led"+id).value||0;
  });
  ACC.forEach(function(a){if(g("acc_"+a.id))S.acc[a.id]=g("acc_"+a.id).checked?1:0;});
  if(S.page==="design")S.dShow=1; else S.iShow=1; draw();
}
function lines(){
  var L=[],w=S.bepW;
  if(S.rooms.bep&&w){
    L.push(["Tủ bếp dưới",mn(S.bepDuoi)+". Ngang "+w+" m.",w*boxP(S.bepDuoi)]);
    L.push(["Tủ bếp trên",mn(S.bepTren)+". Ngang "+w+" m.",w*topP(S.bepTren)]);
    if(S.kich)L.push(["Tủ bếp kịch trần",mn(S.bepTren)+". Ngang "+w+" m.",w*(topP(S.bepTren)-200000)]);
    if(S.da!=="khong")L.push(["Mặt đá bếp",(S.da==="su"?"Đá sứ":S.da==="lamar"?"Đá lamar":"Đá kim sa")+". Dài "+w+" m.",w*daP(S.da)]);
    if(S.op!=="khong")L.push(["Ốp đứng bếp",(S.op==="k6"?"Kính sơn màu 6li":S.op==="k8"?"Kính sơn màu 8li":"Đá kim sa")+". Dài "+w+" m.",w*opP(S.op)]);
    if(S.ledB)L.push(["Đèn LED bếp","Hệ LED theo chiều dài bếp, kèm cảm biến nhấn mở.",w*250000+200000]);
    if(S.lanh)L.push(["Khung tủ lạnh",mn(S.lanh)+".",lanhP(S.lanh)]);
    if(S.bon)L.push(["Thùng nhựa bồn rửa","Gợi ý khi làm thùng MDF.","900000"]);
    S.bon&& (L[L.length-1][2]=900000);
    ACC.forEach(function(a){if(a.z==="bep"&&S.acc[a.id])L.push([a.name,"Phụ kiện hoàn thiện, đã gồm công lắp đặt.",a.goc*0.6+150000]);});
  }
  if(S.rooms.khach){
    if(S.kh.ke)L.push(["Kệ tivi","Ngang "+S.kh.ke+" m.",S.kh.ke*1650000]);
    if(S.kh.op)L.push(["Ốp tường trang trí",(S.kh.op==="tre"?"Than tre":S.kh.op==="lam"?"Lam sóng nano nhựa":"MDF phủ Melamine")+", xương MDF cách ẩm.",(S.kh.opm||0)*(S.kh.op==="tre"?1200000:S.kh.op==="lam"?450000:750000)]);
    if(S.kh.giay)L.push(["Tủ giày","Diện tích yêu cầu.",S.kh.giay*1900000]);
    if(S.kh.rem)L.push(["Rèm 2 lớp chống nắng","Diện tích yêu cầu.",S.kh.rem*390000]);
  }
  if(S.rooms.an){
    if(S.an.tu==="mdf")L.push(["Tủ rượu","MDF, cánh kính MDF.",S.an.m2*2250000]);
    if(S.an.tu==="nhom")L.push(["Tủ rượu","Cánh nhôm kính.",S.an.m2*2750000]);
    if(S.an.ban==="4")L.push(["Bộ bàn ăn 4 ghế","Bàn sắt mặt đá, ghế sắt bọc nệm, sơn tĩnh điện.",4000000]);
    if(S.an.ban==="6")L.push(["Bộ bàn ăn 6 ghế","Bàn sắt mặt đá, ghế sắt bọc nệm, sơn tĩnh điện.",6000000]);
  }
  ["master","n2","n3"].forEach(function(id){
    if(!S.rooms[id])return;
    var n=S.ngu[id], ten=id==="master"?"master":id==="n2"?"2":"3", gia=tuP(n.mat)+(n.nk?900000:0);
    if(n.m2)L.push(["Tủ quần áo ngủ "+ten,mn(n.mat)+(n.nk?" , cánh nhôm kính.":"."),n.m2*gia]);
    if(n.bed)L.push(["Giường ngủ "+ten,"Khổ "+(n.bed==="14"?"1m4":n.bed==="16"?"1m6":n.bed==="18"?"1m8":"2m")+".",n.bed==="14"?4e6:n.bed==="16"?43e5:n.bed==="18"?46e5:5e6]);
    if(n.hoc)L.push(["Hộc kéo ngủ "+ten,"Số hộc theo yêu cầu.",n.hoc*250000]);
    if(n.tab)L.push(["Tab đầu giường "+ten,n.tab==="lon"?"Tab lớn.":"Tab nhỏ.",n.tab==="lon"?1200000:900000]);
    if(n.td)L.push(["Bàn trang điểm "+ten,n.td==="dung"?"Dạng đứng.":"Dạng treo.",(n.tdmd||0)*(n.td==="dung"?3e6:25e5)]);
    if(n.rem)L.push(["Rèm ngủ "+ten,"Rèm 2 lớp chống nắng.",n.rem*390000]);
    if(n.led)L.push(["LED ngủ "+ten,"Hệ LED, kèm cảm biến.",n.led*250000+200000]);
    if(id==="master")ACC.forEach(function(a){if(a.z==="master"&&S.acc[a.id])L.push([a.name,"Phụ kiện hoàn thiện, đã gồm công lắp đặt.",a.goc*0.6+150000]);});
  });
  if(S.rooms.tho){
    if(S.tho.vach==="cnc")L.push(["Vách phòng thờ","CNC MDF sơn cạnh.",S.tho.m2*1200000]);
    if(S.tho.vach==="nano")L.push(["Vách phòng thờ","Ốp nano lam sóng kết hợp họa tiết CNC.",S.tho.m2*900000]);
  }
  return L;
}
function accUI(z){
  var h='<div class="card"><b>Phụ kiện</b><p class="muted">Món gắn sao là gợi ý từ nhu cầu. Bỏ tick nếu không dùng.</p>';
  ACC.forEach(function(a){if(a.z===z)h+='<p><label><input id="acc_'+a.id+'" type="checkbox" '+(S.acc[a.id]?"checked":"")+'> '+a.name+(a.sug?" · gợi ý":"")+'</label></p>';});
  return h+"</div>";
}
function draw(){
  var h=logo(),i;
  if(S.page==="welcome"){
    h+='<h1>Báo giá tự động</h1><div class="card"><label>Họ và tên<input id="fn"></label><label>Số điện thoại<input id="ph"></label><label>Địa chỉ<input id="ad"></label><p><label><input type="checkbox" id="ok"> Đồng ý lưu thông tin tư vấn</label></p><p id="er" class="muted"></p><button class="btn" onclick="start()">Vào ứng dụng</button></div>';
  }else if(S.page==="home"){
    h+='<p class="muted">Xin chào '+S.c.fullName+'</p><div class="card"><b>Thiết kế nhà</b><p class="muted">Chọn gói, nhập diện tích.</p><button class="btn" onclick="go(\'design\')">Tiếp tục</button></div><div class="card"><b>Nội thất</b><p class="muted">Chọn khu, vật liệu, phụ kiện.</p><button class="btn" onclick="go(\'interior\')">Tiếp tục</button></div>';
  }else if(S.page==="design"){
    h+='<button class="btn btn2 noprint" onclick="go(\'home\')">← Quay lại</button><h1>Thiết kế</h1>';
    h+='<div class="card noprint"><div class="muted">Gợi ý nhanh</div><textarea id="ai" rows="2" placeholder="Ví dụ: căn hộ 65m2">'+S.ai+'</textarea><button class="btn2 btn" onclick="applyAI()">Điền giúp</button></div>';
    h+='<div class="pkg '+(S.dPkg==="tiet-kiem"?"on":"")+'" onclick="S.dPkg=\'tiet-kiem\';draw()"><b>Tiết kiệm</b><div class="muted">Mặt bằng công năng 2D. Phối cảnh 3D nội thất các không gian chính.</div></div>';
    h+='<div class="pkg '+(S.dPkg==="co-ban"?"on":"")+'" onclick="S.dPkg=\'co-ban\';draw()"><b>Cơ bản</b><div class="muted">Toàn bộ hạng mục gói Tiết kiệm. Bản vẽ 2D chi tiết kích thước. Chỉ định vật liệu nội thất. Bản vẽ 2D ổ cắm điện, nước.</div></div>';
    h+='<div class="pkg '+(S.dPkg==="hoan-thien"?"on":"")+'" onclick="S.dPkg=\'hoan-thien\';draw()"><b>Hoàn thiện</b><div class="muted">Toàn bộ hạng mục gói Cơ bản. Hồ sơ kết cấu. 3D mặt đứng, mặt tiền. Hồ sơ bàn giao hoàn chỉnh.</div></div>';
    h+='<label>Diện tích sàn (m²)<input id="dArea" type="number" value="'+S.dArea+'"></label>';
    h+='<button class="btn noprint" onclick="grab()">Xem báo giá</button>';
    if(S.dShow){
      if(S.dArea<30)h+='<div class="card">Dưới 30m² vui lòng liên hệ '+PHONE+'</div>';
      else{var m=mon(S.dArea*pkgP());h+='<div class="card"><b>Gói '+pkgN()+'</b><p class="muted">'+pkgI()+'</p>'+tot(m)+'<button class="btn noprint" onclick="pdf(\'Thiết kế\','+m.t+')">Tải PDF</button></div>';}
    }
  }else if(S.page==="interior"){
    h+='<button class="btn btn2 noprint" onclick="go(\'home\')">← Quay lại</button><h1>Nội thất</h1>';
    h+='<div class="card noprint"><div class="muted">Gợi ý nhanh</div><textarea id="ai" rows="2" placeholder="Ví dụ: bếp 3m, tủ áo 1m9">'+S.ai+'</textarea><button class="btn2 btn" onclick="applyAI()">Điền giúp</button></div>';
    if(S.ask){h+='<div class="card"><b>'+S.ask.v+' m là chiều ngang tủ. Chiều cao?</b><label>Mét cao<input id="cao" type="number" step="0.1" value="2.4"></label><button class="btn" onclick="setCao()">Tiếp tục</button></div>';}
    h+='<div class="card"><b>Khu vực</b>';
    var rs=[["bep","Bếp"],["master","Phòng ngủ master"],["n2","Phòng ngủ 2"],["n3","Phòng ngủ 3"],["khach","Phòng khách"],["an","Phòng ăn"],["tho","Phòng thờ"]];
    for(i=0;i<rs.length;i++)h+='<p><label><input type="checkbox" '+(S.rooms[rs[i][0]]?"checked":"")+' onchange="S.rooms[\''+rs[i][0]+'\']=this.checked;if(this.checked)sugAcc();draw()"> '+rs[i][1]+'</label></p>';
    h+='</div>';
    if(S.rooms.khach){h+='<div class="card"><b>Phòng khách</b><label>Kệ TV (m)<input id="ke" type="number" step="0.1" value="'+S.kh.ke+'"></label><label>Ốp tường<select id="khop"><option value="">Không</option><option value="mel">MDF phủ Melamine</option><option value="tre">Than tre</option><option value="lam">Lam sóng nano</option></select></label><label>Diện tích ốp (m²)<input id="opm" type="number" step="0.1" value="'+S.kh.opm+'"></label><label>Tủ giày (m²)<input id="giay" type="number" step="0.1" value="'+S.kh.giay+'"></label><label>Rèm (m²)<input id="krem" type="number" step="0.1" value="'+S.kh.rem+'"></label></div>';}
    if(S.rooms.bep){
      h+='<div class="card"><b>Bếp</b><label>Chiều dài (m)<input id="bepW" type="number" step="0.1" value="'+S.bepW+'"></label>';
      h+='<label>Tủ dưới'+sel("bepDuoi",S.bepDuoi)+'</label><label>Tủ trên'+sel("bepTren",S.bepTren)+'</label>';
      h+='<p><label><input id="kich" type="checkbox" '+(S.kich?"checked":"")+'> Tủ kịch trần</label></p>';
      h+='<label>Mặt đá<select id="da"><option value="kimsa">Đá kim sa</option><option value="su">Đá sứ</option><option value="lamar">Đá lamar</option><option value="khong">Không</option></select></label>';
      h+='<label>Ốp đứng<select id="op"><option value="k8">Kính 8li</option><option value="k6">Kính 6li</option><option value="kimsa">Đá kim sa</option><option value="khong">Không</option></select></label>';
      h+='<label>Khung tủ lạnh<select id="lanh"><option value="">Không</option><option value="mdf_mel">MDF chống ẩm phủ Melamine</option><option value="ply_mel">Plywood phủ Melamine</option><option value="mdf_acr">MDF chống ẩm phủ Acrylic</option><option value="nhua_film">Nhựa đặc phủ film</option><option value="nhua_acr">Nhựa đặc phủ Acrylic</option></select></label>';
      h+='<p><label><input id="ledB" type="checkbox" '+(S.ledB?"checked":"")+'> LED + cảm biến</label></p>';
      h+='<p><label><input id="bon" type="checkbox" '+(S.bon?"checked":"")+'> Thùng nhựa bồn rửa</label></p></div>'+accUI("bep");
    }
    if(S.rooms.an){h+='<div class="card"><b>Phòng ăn</b><label>Tủ rượu<select id="antu"><option value="">Không</option><option value="mdf">MDF cánh kính MDF</option><option value="nhom">Cánh nhôm kính</option></select></label><label>Diện tích tủ rượu (m²)<input id="anm2" type="number" step="0.1" value="'+S.an.m2+'"></label><label>Bàn ăn<select id="anban"><option value="">Không</option><option value="4">4 ghế</option><option value="6">6 ghế</option></select></label></div>';}
    ["master","n2","n3"].forEach(function(id){
      if(!S.rooms[id])return;
      var n=S.ngu[id],ten=id==="master"?"master":id==="n2"?"2":"3";
      h+='<div class="card"><b>Phòng ngủ '+ten+'</b><label>Tủ áo (m²)<input id="tu'+id+'" type="number" step="0.1" value="'+n.m2+'"></label><label>Vật liệu tủ'+sel("mat"+id,n.mat)+'</label><p><label><input id="nk'+id+'" type="checkbox" '+(n.nk?"checked":"")+'> Cánh nhôm kính</label></p>';
      h+='<label>Giường<select id="bed'+id+'"><option value="">Không</option><option value="14">1m4</option><option value="16">1m6</option><option value="18">1m8</option><option value="20">2m</option></select></label>';
      h+='<label>Hộc kéo<input id="hoc'+id+'" type="number" value="'+n.hoc+'"></label>';
      h+='<label>Tab<select id="tab'+id+'"><option value="">Không</option><option value="nho">Nhỏ</option><option value="lon">Lớn</option></select></label>';
      h+='<label>Trang điểm<select id="td'+id+'"><option value="">Không</option><option value="dung">Đứng</option><option value="treo">Treo</option></select></label>';
      h+='<label>Md trang điểm<input id="tdmd'+id+'" type="number" step="0.1" value="'+n.tdmd+'"></label>';
      h+='<label>Rèm (m²)<input id="rem'+id+'" type="number" step="0.1" value="'+n.rem+'"></label>';
      h+='<label>LED (md)<input id="led'+id+'" type="number" step="0.1" value="'+n.led+'"></label></div>';
      if(id==="master")h+=accUI("master");
    });
    if(S.rooms.tho){h+='<div class="card"><b>Phòng thờ</b><label>Vách<select id="thov"><option value="">Không</option><option value="cnc">CNC MDF sơn cạnh</option><option value="nano">Nano lam + họa tiết CNC</option></select></label><label>Diện tích (m²)<input id="thom2" type="number" step="0.1" value="'+S.tho.m2+'"></label><p class="muted">Bàn thờ tùy kiểu, giá báo sau.</p></div>';}
    h+='<button class="btn noprint" onclick="grab()">Xem báo giá</button>';
    if(S.iShow){
      var L=lines(),s=0;
      if(!L.length)h+='<div class="card">Chọn khu vực và kích thước.</div>';
      else{h+='<div class="card">';for(i=0;i<L.length;i++){s+=L[i][2];h+='<div class="line"><div><b>'+L[i][0]+'</b><div class="muted">'+L[i][1]+'</div></div><b>'+vnd(L[i][2])+'</b></div>';}
        var mm=mon(s);h+=tot(mm)+'<button class="btn noprint" onclick="pdf(\'Nội thất\','+mm.t+')">Tải PDF</button></div>';}
    }
  }else{
    h+='<button class="btn btn2 noprint" onclick="go(\'home\')">← Quay lại</button><h1>'+S.last.code+'</h1><p class="muted">Đã gửi thông tin. In → Save as PDF.</p><a class="btn" href="'+ZALO+'" style="display:block;text-align:center;color:#fff">Zalo Tú</a>';
  }
  document.getElementById("app").innerHTML=h;
}
try{load();draw();}catch(e){document.getElementById("app").textContent=e.message;}
</script>
</body>
</html>
