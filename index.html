<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WOTU</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;background:#171513;color:#F7F2E9;font-size:15px;line-height:1.55;min-height:100vh;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:999px;filter:blur(70px);opacity:.28;pointer-events:none;animation:float 14s ease-in-out infinite alternate}
body:before{width:260px;height:260px;background:#B96F32;top:-80px;right:-90px}
body:after{width:220px;height:220px;background:#6E3C28;bottom:-90px;left:-80px;animation-delay:-5s}
@keyframes float{to{transform:translate3d(24px,18px,0) scale(1.12)}}
.w{max-width:1120px;margin:0 auto;padding:20px 18px 80px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.brand{display:flex;gap:14px;align-items:center}
.brand img{height:52px;width:auto;display:block;mix-blend-mode:multiply;filter:drop-shadow(0 8px 18px rgba(0,0,0,.25))}
.links a{margin-left:12px;color:#E5A866;text-decoration:none;font-size:13px;font-weight:500}
h1{font-size:28px;margin:14px 0 8px;font-weight:600;letter-spacing:-.02em}
.lead,.muted,.note,.live{color:#BDB3A7}
.card{background:rgba(35,31,28,.88);border-color:rgba(255,255,255,.1);box-shadow:0 18px 45px rgba(0,0,0,.16);backdrop-filter:blur(10px)}
.pkg,input,select,textarea,.chip{background:#292521;color:#F7F2E9;border-color:#514940}
.pkg.on{border-color:#E5A866;box-shadow:0 0 0 1px #E5A866 inset}
.btn{background:#D8914E;color:#211811;box-shadow:0 8px 18px rgba(216,145,78,.2)}
.btn2{background:transparent;color:#F7F2E9;border-color:#514940}
.tot{background:linear-gradient(135deg,#9D5C2C,#D8914E);color:#211811}
.spec{background:#292521}.review{border-color:#8BA77C;background:#263026}.review h2{color:#B9D7A9}
.site-info{display:grid;gap:10px;margin-top:18px;padding-top:18px;border-top:1px solid rgba(255,255,255,.12);color:#BDB3A7;font-size:12px}.site-info b{color:#F7F2E9;font-size:13px}
.catalog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.catalog div{padding:10px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.03);font-size:12px}.catalog span{display:block;color:#E5A866;font-size:11px;margin-top:2px}
.lead{max-width:42ch;margin:0 0 18px}
.card{background:#FFFcf7;border-radius:16px;padding:18px;margin:0 0 14px;border:1px solid #E6DFD4}
.card h2{font-size:14px;margin:0 0 10px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pkg{border:1px solid #E6DFD4;border-radius:14px;padding:14px;margin:0 0 10px;cursor:pointer;background:#fff}
.pkg.on{border-color:#1C1917}
.row{display:flex;justify-content:space-between;gap:8px}
label{display:block;margin:10px 0 0;font-size:12px;font-weight:500}
input,select,textarea{width:100%;margin-top:6px;padding:10px 12px;border:1px solid #E6DFD4;border-radius:10px;font:inherit;background:#fff}
input[type=checkbox]{width:15px!important;height:15px!important;margin:0!important;padding:0!important;flex:0 0 15px;accent-color:#1C1917}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid #E6DFD4;background:#fff;border-radius:999px;padding:7px 12px;font-size:13px}
.check{display:flex;align-items:center;gap:8px;margin:12px 0;font-size:13px}
.btn{width:100%;border:0;border-radius:999px;padding:12px 16px;margin-top:12px;background:#1C1917;color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn2{background:#fff;color:#1C1917;border:1px solid #E6DFD4}
.tot{background:#1C1917;color:#fff;border-radius:14px;padding:16px;margin-top:10px}
.line{padding:12px 0;border-bottom:1px solid #efe8de;display:flex;gap:10px}
.err{color:#8B1E1E;font-size:13px}
.lay{display:grid;gap:16px}
.spec{margin:12px 0 0;padding:14px;background:#F7F4EF;border-radius:12px}.review{border-color:#B7C9B0;background:#F3F8F0}.review h2{color:#3E5B3A}.review .muted{white-space:normal}
.spec ul{margin:6px 0 12px;padding-left:18px}
.spec li{margin:4px 0;font-size:13px;line-height:1.55}
.printonly{display:none}
.card{background:rgba(35,31,28,.94);border-color:rgba(255,255,255,.12);color:#F7F2E9}.card h2{color:#F7F2E9}.card .muted,.card .live{color:#C8BFB5}.pkg{background:#292521;color:#F7F2E9;border-color:#514940}.btn{background:#D8914E;color:#211811}.btn2{background:transparent;color:#F7F2E9;border-color:#514940}.spec{background:#292521;color:#F7F2E9}.line{border-color:rgba(255,255,255,.12)}
@media(min-width:960px){.lay{grid-template-columns:1.05fr .9fr}.side{position:sticky;top:16px}}
@media print{.noprint{display:none!important}.printonly{display:block!important}.brand img{height:60px}h1{display:none}}
/* Bright, readable customer-facing theme */
body{background:linear-gradient(135deg,#f7f3ed 0%,#fffaf3 52%,#f3eadf 100%);color:#26211d}
body:before{background:#e9b56f;opacity:.22}body:after{background:#d8b99a;opacity:.2}
.brand img{mix-blend-mode:normal;filter:drop-shadow(0 6px 12px rgba(67,47,29,.14))}
.links a{color:#9b5d27}.lead,.muted,.note,.live{color:#6d6258}
.card{background:rgba(255,255,255,.9);border-color:#e7ddd0;box-shadow:0 16px 36px rgba(80,57,35,.1);color:#26211d}
.card h2{color:#332a23}.card .muted,.card .live{color:#6d6258}
.pkg{background:#fff;color:#26211d;border-color:#e2d7ca}.pkg.on{border-color:#b66d32;box-shadow:0 0 0 1px #b66d32 inset}
input,select,textarea{background:#fff;color:#26211d;border-color:#cfc1b3;caret-color:#8f4f20}
input::placeholder,textarea::placeholder{color:#978a7d;opacity:1}
.chip{background:#fff;color:#40362e;border-color:#ded2c5}.btn{background:#a85f29;color:#fff}.btn2{background:#fff;color:#4a392c;border-color:#d6c7b8}
.tot{background:linear-gradient(135deg,#8e4f24,#c57a39);color:#fff}.spec{background:#f8f3ec;color:#332b25}.review{background:#f3f8f0}.line{border-color:#eadfd4}
  .room-extras{margin-top:14px;padding-top:12px;border-top:1px solid #eadfd4;display:grid;gap:8px}.room-extras h3{margin:0;font-size:15px}.room-extras label{display:flex;align-items:center;gap:7px}.room-extras input[type=number]{width:90px;margin-left:auto}.island-fields{margin-top:18px;padding-top:14px;border-top:1px solid #eadfd4}.island-fields h3{font-size:17px;margin:0 0 2px}.island-fields h3 .muted{font-size:11px;font-weight:400}.island-fields label{margin-top:7px}.island-fields input,.island-fields select{padding:8px 10px;margin-top:4px}.admin-fab{position:fixed;right:14px;bottom:14px;z-index:20;padding:9px 12px;border:1px solid #d6c7b8;border-radius:999px;background:#fff;color:#4a392c;font-size:12px;box-shadow:0 8px 20px rgba(80,57,35,.14);cursor:pointer}.admin-login{max-width:420px}.admin-panel{margin-top:18px}.admin-lead{display:grid;gap:3px;padding:12px 0;border-bottom:1px solid #eadfd4}.admin-lead a{color:#a85f29;font-weight:600}.admin-lead span,.admin-lead small{color:#6d6258;font-size:13px}.admin-lead small{font-size:11px}.admin-settings{margin:16px 0 22px;padding:14px;border:1px solid #eadfd4;border-radius:12px;background:#fffaf5}.admin-settings h2{margin-top:0}.admin-subtitle{margin-top:22px!important;padding-top:16px;border-top:1px solid #eadfd4}
  </style>
  </style>
</head>
<body>
<img id="wlogo" alt="" hidden>
<div class="w" id="app">WOTU</div>
<script src="logo.js"></script>
<script>if(window.WOTU_LOGO){var el=document.getElementById("wlogo");if(el)el.src=window.WOTU_LOGO}</script>
<script src="app.js"></script>
<script>
function terms(){return '<div class="spec"><b>Hình thức thanh toán</b><ul><li>Đợt 1 — 30% khi ký hợp đồng, chốt bản vẽ và vật liệu.</li><li>Đợt 2 — 50% khi xưởng gia công / trước ngày lắp đặt.</li><li>Đợt 3 — 20% còn lại khi nghiệm thu, bàn giao công trình.</li></ul><b>Cách thức làm việc</b><ul><li>Khảo sát hiện trạng tại công trình.</li><li>Chốt bản vẽ, vật liệu và báo giá chính thức.</li><li>Ký hợp đồng, đặt cọc, sản xuất tại xưởng WOTU.</li><li>Lắp đặt tại công trình, nghiệm thu và bàn giao.</li></ul><div class="muted">Phiếu này là ước lượng sơ bộ. Số liệu chốt theo hợp đồng sau khảo sát.</div></div>'}
function tot(m){return '<div class="tot"><div class="row"><span>Chưa VAT</span><span>'+vnd(m.s)+'</span></div><div class="row"><span>VAT 8%</span><span>'+vnd(m.v)+'</span></div><div class="row"><b>Tổng</b><b>'+vnd(m.t)+'</b></div></div>'+specs()+terms()+notes()}
</script>
</body>
</html>
